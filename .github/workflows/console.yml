name: Console

on:
  push:
    branches: [main, master]
  pull_request:
  # The flake hunt below. Nightly rather than weekly: the failure mode being
  # looked for is a suite that fails one run in three, and learning that a week
  # late means a week of pushes gated by a suite nobody should have trusted.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# The definition of done in CLAUDE.md, enforced.
jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    # Without this the registry's PostgreSQL suite skips, and "durable storage
    # works" would rest on whether a developer happened to have a database
    # running. The skip exists so a developer without one can still run the
    # rest; it must not become the normal case.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/console

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      # This checked zero files until 2026-09-06: the root tsconfig has
      # `"include": []` and `tsc --noEmit -p` does not build references.
      # `tsconfig.typecheck.json` is a single non-composite program over every
      # package, its tests, bench and scripts — the coverage the console's own
      # typecheck cannot reach.
      - name: Typecheck (packages, tests, bench, scripts)
        run: npx tsc --noEmit -p tsconfig.typecheck.json
        working-directory: .


      # This is the one with real coverage. The console resolves @metis/core,
      # @metis/runtime and @metis/compiler through path aliases, so its
      # typecheck is what actually type-checks those packages today. It caught
      # the CatalogueSnapshot change that the root step slept through.
      #
      # The per-package tsconfigs have rootDir and include problems that make
      # `tsc --build` fail on pre-existing Phase 0 files; registered in
      # docs/gaps.md rather than papered over here.
      - name: Typecheck (console and the packages it uses)
        run: npx tsc --noEmit
        working-directory: apps/console

      - name: Lint
        run: npm run lint

      # The root config ignores apps/console, so the console needs its own run.
      # Without this step the console was linted by nobody.
      - name: Lint (console)
        run: npm run lint -w @metis/console

      # The Phase 0 gate: same artifact + same inputs = byte-identical decision.
      - name: Determinism (execution engine)
        run: npm run test:runtime
        working-directory: .

      # Nothing reaches the runtime that the compiler would have rejected.
      - name: Compiler
        run: npm run test:compiler
        working-directory: .

      # The decision ledger: append-only records, outcomes and durable
      # idempotency. Same shape as the registry — one behaviour suite run
      # against memory and a real PostgreSQL, so "durable storage changes
      # nothing" stays a checked claim.
      - name: Ledger
        run: npm run test:ledger
        working-directory: .
        env:
          METIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metis_registry_test

      # Nothing that fails to compile can enter the registry, so nothing that
      # fails to compile can be promoted to an environment.
      - name: Registry
        run: npm run test:registry
        working-directory: .
        env:
          METIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metis_registry_test

      # The Phase 0 performance gate, which the plan says runs on every commit
      # and until now ran nowhere: the harness had no script, no test and no
      # step, and measured a 0.17ms operation with Date.now().
      - name: Performance budget
        run: npm run test:bench
        working-directory: .

      # The form descriptors, diffed against the OpenAPI schema in both
      # directions. A descriptor that has fallen behind its schema renders a
      # form that looks complete and silently cannot edit the new field, which
      # is worse than no descriptor at all.
      - name: Form descriptors match the spec
        run: npm run test:ui-metadata
        working-directory: .

      # The seam between the planes: author -> compile -> execute -> replay.
      - name: Integration
        run: npm run test:integration
        working-directory: .

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The end-to-end suite moved to the sharded `e2e` job below. It was ~13
      # minutes of a serial job that gates every push, and it is the only step
      # here that parallelises cleanly: every other step is a suite small enough
      # that a runner's startup would cost more than it saved.

      # Builds and serves the standalone output, then measures what a browser
      # actually downloads per route. Separate from the E2E step because that
      # one runs `next dev`, whose unminified modules make a size budget
      # meaningless.
      - name: Route bundle budgets
        run: npm run test:bundle

      # The flaky-test summary moved with the suite, into `e2e-report`. It has
      # to read one report covering every shard, which is what `merge-reports`
      # produces — running it per shard would print four partial summaries and
      # none of them would be the answer.

      # What the bundle-budget run leaves behind. This said
      # `apps/console/playwright-report` and pointed at the html reporter's
      # directory, which nothing in this repo writes — the same mistake the
      # flake hunt made, in the job next door.
      - name: Upload bundle-budget report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget-report
          path: apps/console/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The end-to-end suite, split four ways.
  #
  # It was ~13 minutes inside `verify`, serially, gating every push — more than
  # the rest of that job put together. Four runners take a quarter of the tests
  # each and finish in roughly a quarter of the time, at the cost of four
  # `npm ci` installs.
  #
  # `fail-fast: false` because a shard failing tells you nothing about the other
  # three, and cancelling them throws away the evidence of whether the failure is
  # local to one group of specs or general.
  #
  # **The count lives in one place.** `tests/e2e-sharding.test.ts` reads this
  # matrix and asserts that the shards partition the suite — every test in
  # exactly one shard, none dropped, none run twice. Changing 4 here without
  # changing it there fails that check rather than silently running three
  # quarters of the suite.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Covers navigation, auth, RBAC, persistence, and axe-core at WCAG 2.2 AA.
      #
      # `blob` rather than the config's reporters: it is the only format
      # `merge-reports` can recombine, and a merged report is what the flaky
      # summary needs. The json and github reporters are produced from the merge,
      # once, in the job below.
      - name: End-to-end and accessibility (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/console/blob-report
          retention-days: 7
          if-no-files-found: error

  # One report over all four shards, and the gate.
  #
  # `needs` with `if: always()` so this runs even when a shard failed — that is
  # exactly when the merged report is worth having. The shards do not fail the
  # workflow themselves; this job does, after saying which tests were flaky.
  e2e-report:
    if: always() && github.event_name != 'schedule'
    needs: [e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: apps/console/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # Fails loudly if a shard produced nothing. A merge over three reports
      # succeeds and reports on three quarters of the suite, which is the
      # silent-drop failure this whole job exists to make impossible.
      - name: Every shard reported
        run: |
          found=$(ls all-blob-reports/*.zip 2>/dev/null | wc -l)
          echo "blob reports: $found"
          [ "$found" -eq 4 ] || { echo "::error::expected 4 blob reports, found $found"; exit 1; }

      - name: Merge into one report
        run: npx playwright merge-reports --reporter=json all-blob-reports > playwright-results.json

      - name: Report flaky tests
        if: always()
        run: node ../../scripts/report-flaky.mjs playwright-results.json

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: apps/console/playwright-results.json
          retention-days: 7
          if-no-files-found: ignore

      # The gate. A shard that failed has to fail the workflow, and it has to do
      # it after the summary above rather than instead of it.
      - name: Every shard must be green
        if: always()
        run: |
          echo "shards: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1

  spec:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install
        run: npm ci

      # The spec is the contract between the console and the execution plane.
      # Structure first: refs resolve, ids are unique, nothing is unreachable.
      - name: Validate the OpenAPI spec
        run: node scripts/validate-spec.mjs

      # The corpus is generated from the reference implementation and
      # committed. A stale corpus means the TypeScript conformance test is
      # asserting against yesterday's output.
      - name: The conformance corpus matches the reference
        run: |
          npm run corpus
          if ! git diff --exit-code --stat docs/conformance/; then
            echo "::error::a conformance corpus is stale. Run: npm run corpus"
            exit 1
          fi

      # packages/client is generated from the spec and committed. If these
      # disagree, someone hand-edited the client or changed the spec without
      # regenerating - either way the types the console compiles against are
      # no longer the contract.
      - name: The generated client matches the spec
        run: |
          npm run generate
          if ! git diff --exit-code --stat packages/client/src/generated.ts; then
            echo "::error::packages/client is stale. Run: npm run generate"
            exit 1
          fi

  # A second implementation of ADR-003, held to the same corpus as the
  # TypeScript reference. If both jobs are green, a decision hashed by either
  # engine carries the same chain hash — which is the only thing that makes a
  # second engine worth having.
  kotlin-conformance:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Three suites. :engine covers the value corpus (how a value hashes) and
      # the decision corpus (what a decision is); :service pushes 60 of the
      # console's real decisions through HTTP and compares chain hashes.
      # Passing all three is what makes a chain hash mean the same thing
      # whichever engine produced it.
      - name: Conformance (Kotlin engine and service)
        run: ./gradlew test --no-daemon
        working-directory: engines/kotlin

  # ---------------------------------------------------------------------------
  # The flake hunt.
  #
  # CI ran the e2e suite once per push, and `retries: 1` reported a test that
  # passed on its second attempt as passing. A suite failing one run in three
  # therefore passed two pushes in three. Three order-dependent failures lived
  # in the tree for weeks on that basis, and were only found because somebody
  # happened to run the suite four times in one sitting while chasing something
  # else.
  #
  # Three runs plus a shuffled one, nightly. Not on every push: the suite is
  # fourteen minutes, so this is an hour of runner time and would be
  # unworkable as a gate.
  #
  # `--fail-on-flaky-tests` is the point of the job. Here a test that needs a
  # retry is a failure, because this is the run whose whole purpose is to find
  # one.
  # ---------------------------------------------------------------------------
  flake-hunt:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Each run reports its own result and none of them gates the next.
      #
      # These were a plain `run:` chain until 2026-09-10, so the first failure
      # ended the job and every later step was skipped. Run #33 — the first
      # time the hunt ever fired — failed in Run 1 and skipped Runs 2, 3 and
      # the shuffled one, which is the only step that varies order and the
      # reason the job exists. A flake hunt that stops at the first flake has
      # reported one sample and called it a night.
      #
      # `continue-on-error` rather than `if: always()`: the step still shows
      # red in the UI and its outcome is readable from `steps.<id>.outcome`,
      # where `if: always()` alone would leave the job green.
      - name: Run 1
        id: run1
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-1.json
        run: npx playwright test --fail-on-flaky-tests --output=test-results/run-1

      - name: Run 2
        id: run2
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-2.json
        run: npx playwright test --fail-on-flaky-tests --output=test-results/run-2

      - name: Run 3
        id: run3
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-3.json
        run: npx playwright test --fail-on-flaky-tests --output=test-results/run-3

      # Playwright sorts spec files by path and has no shuffle, so the order is
      # varied by splitting the suite into four groups and running the groups in
      # a random sequence against the same reused server. That is what actually
      # matters here: the dev store is process-wide, so the question is which
      # specs have run before which, not the order inside one invocation.
      #
      # Seeded from the run id, so each night differs and any single failure can
      # be reproduced from the log.
      - name: Run 4 — shuffled group order
        id: run4
        continue-on-error: true
        run: |
          mapfile -t SPECS < <(ls tests/e2e/*.spec.ts | shuf --random-source=<(yes ${{ github.run_id }}))
          echo "::group::order"
          printf '%s\n' "${SPECS[@]}"
          echo "::endgroup::"
          n=${#SPECS[@]}
          per=$(( (n + 3) / 4 ))
          fail=0
          for g in 0 1 2 3; do
            start=$(( g * per ))
            chunk=("${SPECS[@]:start:per}")
            [ ${#chunk[@]} -eq 0 ] && continue
            echo "--- group $((g+1)): ${#chunk[@]} files"
            PLAYWRIGHT_JSON_OUTPUT_NAME="playwright-results-4-g$((g+1)).json"               npx playwright test "${chunk[@]}" --fail-on-flaky-tests --output="test-results/run-4-g$((g+1))" || fail=1
          done
          exit $fail

      # `if: always()`, and the paths a run actually writes.
      #
      # This uploaded nothing on run #33: `--reporter=line` on the command line
      # replaces the config's reporter list, so no `playwright-results.json`
      # was written, and `playwright-report` is the *html* reporter's directory,
      # which nothing here has ever produced. The trace and the screenshot were
      # captured — the log names `test-results/.../trace.zip` — and then thrown
      # away by an upload pointed at the wrong directory.
      #
      # `if: failure()` would not fire either, now that the runs carry
      # `continue-on-error`: the job's status at this point is success until the
      # gate below runs.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-hunt-report
          path: |
            apps/console/test-results
            apps/console/playwright-results-*.json
          retention-days: 14
          if-no-files-found: ignore

      # The gate. Every run has reported by now, so the job fails once, with all
      # four outcomes visible rather than only the first.
      - name: Every run must be clean
        if: always()
        run: |
          fail=0
          for r in "1:${{ steps.run1.outcome }}" "2:${{ steps.run2.outcome }}" "3:${{ steps.run3.outcome }}" "4:${{ steps.run4.outcome }}"; do
            echo "run ${r%%:*}: ${r#*:}"
            [ "${r#*:}" = "success" ] || fail=1
          done
          exit $fail
