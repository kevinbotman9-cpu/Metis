name: Console

on:
  push:
    branches: [main, master]
  pull_request:

# The definition of done in CLAUDE.md, enforced.
jobs:
  verify:
    runs-on: ubuntu-latest

    # Without this the registry's PostgreSQL suite skips, and "durable storage
    # works" would rest on whether a developer happened to have a database
    # running. The skip exists so a developer without one can still run the
    # rest; it must not become the normal case.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      # This checked zero files until 2026-09-06: the root tsconfig has
      # `"include": []` and `tsc --noEmit -p` does not build references.
      # `tsconfig.typecheck.json` is a single non-composite program over every
      # package, its tests, bench and scripts — the coverage the console's own
      # typecheck cannot reach.
      - name: Typecheck (packages, tests, bench, scripts)
        run: npx tsc --noEmit -p tsconfig.typecheck.json
        working-directory: .


      # This is the one with real coverage. The console resolves @metis/core,
      # @metis/runtime and @metis/compiler through path aliases, so its
      # typecheck is what actually type-checks those packages today. It caught
      # the CatalogueSnapshot change that the root step slept through.
      #
      # The per-package tsconfigs have rootDir and include problems that make
      # `tsc --build` fail on pre-existing Phase 0 files; registered in
      # docs/gaps.md rather than papered over here.
      - name: Typecheck (console and the packages it uses)
        run: npx tsc --noEmit
        working-directory: apps/console

      - name: Lint
        run: npm run lint

      # The root config ignores apps/console, so the console needs its own run.
      # Without this step the console was linted by nobody.
      - name: Lint (console)
        run: npm run lint -w @metis/console

      # The Phase 0 gate: same artifact + same inputs = byte-identical decision.
      - name: Determinism (execution engine)
        run: npm run test:runtime
        working-directory: .

      # Nothing reaches the runtime that the compiler would have rejected.
      - name: Compiler
        run: npm run test:compiler
        working-directory: .

      # The decision ledger: append-only records, outcomes and durable
      # idempotency. Same shape as the registry — one behaviour suite run
      # against memory and a real PostgreSQL, so "durable storage changes
      # nothing" stays a checked claim.
      - name: Ledger
        run: npm run test:ledger
        working-directory: .
        env:
          METIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metis_registry_test

      # Nothing that fails to compile can enter the registry, so nothing that
      # fails to compile can be promoted to an environment.
      - name: Registry
        run: npm run test:registry
        working-directory: .
        env:
          METIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metis_registry_test

      # The Phase 0 performance gate, which the plan says runs on every commit
      # and until now ran nowhere: the harness had no script, no test and no
      # step, and measured a 0.17ms operation with Date.now().
      - name: Performance budget
        run: npm run test:bench
        working-directory: .

      # The form descriptors, diffed against the OpenAPI schema in both
      # directions. A descriptor that has fallen behind its schema renders a
      # form that looks complete and silently cannot edit the new field, which
      # is worse than no descriptor at all.
      - name: Form descriptors match the spec
        run: npm run test:ui-metadata
        working-directory: .

      # The seam between the planes: author -> compile -> execute -> replay.
      - name: Integration
        run: npm run test:integration
        working-directory: .

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Covers navigation, auth, RBAC, persistence, and axe-core at WCAG 2.2 AA.
      - name: End-to-end and accessibility
        run: npm run test:e2e

      # Builds and serves the standalone output, then measures what a browser
      # actually downloads per route. Separate from the E2E step because that
      # one runs `next dev`, whose unminified modules make a size budget
      # meaningless.
      - name: Route bundle budgets
        run: npm run test:bundle

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/console/playwright-report
          retention-days: 7

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      # The spec is the contract between the console and the execution plane.
      # Structure first: refs resolve, ids are unique, nothing is unreachable.
      - name: Validate the OpenAPI spec
        run: node scripts/validate-spec.mjs

      # The corpus is generated from the reference implementation and
      # committed. A stale corpus means the TypeScript conformance test is
      # asserting against yesterday's output.
      - name: The conformance corpus matches the reference
        run: |
          npm run corpus
          if ! git diff --exit-code --stat docs/conformance/; then
            echo "::error::a conformance corpus is stale. Run: npm run corpus"
            exit 1
          fi

      # packages/client is generated from the spec and committed. If these
      # disagree, someone hand-edited the client or changed the spec without
      # regenerating - either way the types the console compiles against are
      # no longer the contract.
      - name: The generated client matches the spec
        run: |
          npm run generate
          if ! git diff --exit-code --stat packages/client/src/generated.ts; then
            echo "::error::packages/client is stale. Run: npm run generate"
            exit 1
          fi

  # A second implementation of ADR-003, held to the same corpus as the
  # TypeScript reference. If both jobs are green, a decision hashed by either
  # engine carries the same chain hash — which is the only thing that makes a
  # second engine worth having.
  kotlin-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Three suites. :engine covers the value corpus (how a value hashes) and
      # the decision corpus (what a decision is); :service pushes 60 of the
      # console's real decisions through HTTP and compares chain hashes.
      # Passing all three is what makes a chain hash mean the same thing
      # whichever engine produced it.
      - name: Conformance (Kotlin engine and service)
        run: ./gradlew test --no-daemon
        working-directory: engines/kotlin
