name: Console

on:
  push:
    branches: [main, master]
  pull_request:

# The definition of done in CLAUDE.md, enforced.
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      # The root config ignores apps/console, so the console needs its own run.
      # Without this step the console was linted by nobody.
      - name: Lint (console)
        run: npm run lint -w @metis/console

      # The Phase 0 gate: same artifact + same inputs = byte-identical decision.
      - name: Determinism (execution engine)
        run: npm run test:runtime
        working-directory: .

      # Nothing reaches the runtime that the compiler would have rejected.
      - name: Compiler
        run: npm run test:compiler
        working-directory: .

      # The Phase 0 performance gate, which the plan says runs on every commit
      # and until now ran nowhere: the harness had no script, no test and no
      # step, and measured a 0.17ms operation with Date.now().
      - name: Performance budget
        run: npm run test:bench
        working-directory: .

      # The seam between the planes: author -> compile -> execute -> replay.
      - name: Integration
        run: npm run test:integration
        working-directory: .

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Covers navigation, auth, RBAC, persistence, and axe-core at WCAG 2.2 AA.
      - name: End-to-end and accessibility
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/console/playwright-report
          retention-days: 7

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      # The spec is the contract between the console and the execution plane.
      # Structure first: refs resolve, ids are unique, nothing is unreachable.
      - name: Validate the OpenAPI spec
        run: node scripts/validate-spec.mjs

      # packages/client is generated from the spec and committed. If these
      # disagree, someone hand-edited the client or changed the spec without
      # regenerating - either way the types the console compiles against are
      # no longer the contract.
      - name: The generated client matches the spec
        run: |
          npm run generate
          if ! git diff --exit-code --stat packages/client/src/generated.ts; then
            echo "::error::packages/client is stale. Run: npm run generate"
            exit 1
          fi
