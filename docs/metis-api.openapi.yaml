  /outcomes/{tenantId}/{decisionId}:
    post:
      summary: Record what happened to a decision
      description: |
        Links an impression, click, acceptance, rejection or conversion back to
        the decision that produced it.

        The decision must already exist. An outcome for a decision nobody made
        is a mis-routed event or a mis-typed id, and storing it would put a row
        in the ledger that can never be joined to anything — the kind of orphan
        found years later when someone tries to measure uplift.

        Append-only, like the decision it points at. Storage only: learning
        from outcomes is a later gate.
      operationId: recordOutcome
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: decisionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, occurredAt]
              properties:
                type:
                  type: string
                  enum: [impression, click, acceptance, rejection, conversion]
                occurredAt:
                  type: string
                  format: date-time
                valueMinor:
                  type: [integer, 'null']
                detail:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEvent'
        '404':
