openapi: 3.1.0
info:
  title: METIS Execution Plane API
  version: 2.0.0
  description: |
    AI-native decision platform API.
    Execution plane: deterministic flow execution, artifact registry, approval workflow.
  contact:
    name: METIS Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://metis.example.com/api
    description: Production

components:
  schemas:
    CompiledDecisionFlow:
      type: object
      description: |
        What the compiler emits. Distinct from ArtifactSummary, which is how the
        console renders a flow: this is the immutable, executable form the
        registry stores and the engine runs.
      required:
        [id, version, tenantId, nodes, edges, candidateKeys, packageVersions,
         costManifest, artifactHash, compiledAt]
      properties:
        id:
          type: string
        version:
          type: string
        tenantId:
          type: string
        nodes:
          type: array
          items:
            type: object
        edges:
          type: array
          items:
            type: object
        candidateKeys:
          type: array
          items:
            type: string
        packageVersions:
          type: object
          description: Exact versions, locked at compile time so a replay is reproducible.
          additionalProperties:
            type: string
        costManifest:
          $ref: '#/components/schemas/CostManifest'
        artifactHash:
          type: string
          description: |
            sha256 over everything above. Excludes compiledAt, so two
            compilations of the same source produce the same hash - which is
            what lets the registry treat a republish as a no-op.
        compiledAt:
          type: string
          format: date-time
          description: Metadata, not part of the hash.

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Minor units, e.g. pence. 3500 = 35.00
        currency:
          type: string
          enum: [GBP, USD, EUR]

    Objective:
      type: object
      required:
        - id
        - name
        - key
        - description
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        key:
          type: string
          description: URL-safe stable key, e.g. "retention"
        description: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Category:
      type: object
      required:
        - id
        - objectiveId
        - name
        - key
        - description
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        objectiveId: { type: string }
        name: { type: string }
        key: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ValidityWindow:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt: { type: string, format: date }
        endsAt:
          type: [string, "null"]
          format: date
          description: null means open-ended

    OfferFinancials:
      type: object
      required:
        - price
        - cost
        - expectedMargin
        - termMonths
        - oneOff
      properties:
        price: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        expectedMargin: { $ref: "#/components/schemas/Money" }
        termMonths: { type: integer }
        oneOff: { type: boolean }

    Offer:
      type: object
      required:
        - id
        - categoryId
        - objectiveId
        - name
        - key
        - description
        - status
        - financials
        - validity
        - boost
        - policyIds
        - creativeIds
        - tags
        - createdAt
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        categoryId: { type: string }
        objectiveId:
          type: string
          description: Denormalised from the category for tree and breadcrumb rendering
        name: { type: string }
        key: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [draft, active, paused, retired]
        financials: { $ref: "#/components/schemas/OfferFinancials" }
        validity: { $ref: "#/components/schemas/ValidityWindow" }
        boost:
          type: number
          description: Business priority multiplier. 1.0 is neutral.
        policyIds:
          type: array
          items: { type: string }
        creativeIds:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    Creative:
      type: object
      required:
        - id
        - offerId
        - name
        - channel
        - content
        - active
        - locale
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        offerId: { type: string }
        name: { type: string }
        channel:
          type: string
          enum: [email, sms, web, push, outbound_call]
        content:
          type: object
          description: Channel-specific content; shape is discriminated by channel
          additionalProperties: true
        active: { type: boolean }
        locale: { type: string, example: en-GB }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Targeting and frequency policy
    # -------------------------------------------------------------------------

    PolicyScope:
      type: object
      required:
        - level
        - targetId
      properties:
        level:
          type: string
          enum: [tenant, objective, category, offer]
        targetId:
          type: [string, "null"]
          description: null when level is tenant

    PolicyCondition:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: Dotted path into the customer data model
          example: customer.age
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte, in, not_in, contains, exists, not_exists]
        value: {}

    TargetingPolicy:
      type: object
      required:
        - id
        - name
        - kind
        - description
        - conditions
        - scope
        - active
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [eligibility, relevance, suitability]
          description: >-
            eligibility = can we offer it; relevance = should we now;
            suitability = is it right for this customer
        description: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/PolicyCondition" }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FrequencyPolicy:
      type: object
      required:
        - id
        - name
        - description
        - channel
        - maxContacts
        - period
        - cooldownDaysAfterReject
        - scope
        - active
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        channel:
          type: [string, "null"]
          enum: [email, sms, web, push, outbound_call, null]
          description: null applies to every channel
        maxContacts: { type: integer }
        period:
          type: string
          enum: [day, week, month]
        cooldownDaysAfterReject: { type: integer }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        active: { type: boolean }

    # -------------------------------------------------------------------------
    # Arbitration
    # -------------------------------------------------------------------------

    ArbitrationConfig:
      type: object
      required:
        - id
        - tenantId
        - weights
        - utility
        - formula
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        tenantId: { type: string }
        utility:
          type: object
          description: >
            Which ranking function computes priority. Required, with no
            default: a missing reference used to mean "whatever the engine
            hard-codes", which is the coupling this replaces. Publishing is
            gated on the function existing (UNKNOWN_UTILITY_FUNCTION) and on it
            reading only terms the engine produces (UTILITY_TERM_UNAVAILABLE).
          required: [id, version]
          properties:
            id:
              type: string
              example: multiplicative
            version:
              type: string
              description: >
                Semver. Arithmetic changes are a new version, never an edit —
                decisions already point at the old one.
              example: 1.0.0
        weights:
          type: object
          description: >
            Exponent weights for the multiplicative function. A function that
            reads no weights (expected-value) ignores these entirely.
          required:
            - propensity
            - value
            - boost
            - context
          properties:
            propensity: { type: number }
            value: { type: number }
            boost: { type: number }
            context: { type: number }
        formula: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    Boost:
      type: object
      required:
        - id
        - name
        - scope
        - value
        - reason
        - validity
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        name: { type: string }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        value:
          type: number
          description: Multiplier. 1.0 is neutral.
        reason: { type: string }
        validity:
          oneOf:
            - { $ref: "#/components/schemas/ValidityWindow" }
            - { type: "null" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    # -------------------------------------------------------------------------
    # Agentic AI autonomy
    # -------------------------------------------------------------------------

    AutonomyGuardrails:
      type: object
      required:
        - maxBlastRadiusPct
        - allowedChangeTypes
        - maxBoostDelta
        - maxBudgetDelta
        - protectedAttributes
        - requireSimulationPass
        - biasGateThreshold
      properties:
        maxBlastRadiusPct:
          type: number
          minimum: 0
          maximum: 100
        allowedChangeTypes:
          type: array
          items:
            type: string
            enum:
              - boost_adjust
              - creative_copy
              - policy_edit
              - offer_create
              - offer_retire
              - flow_edit
              - arbitration_weights
        maxBoostDelta:
          type: number
          description: Fraction. 0.1 permits +/-10%.
        maxBudgetDelta: { $ref: "#/components/schemas/Money" }
        protectedAttributes:
          type: array
          items: { type: string }
        requireSimulationPass: { type: boolean }
        biasGateThreshold: { type: number }

    AutonomySetting:
      type: object
      required:
        - id
        - scope
        - level
        - guardrails
        - rationale
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        level:
          type: string
          enum: [L0, L1, L2, L3, L4]
          description: >-
            L0 Observe, L1 Assist, L2 Propose, L3 Bounded, L4 Autonomous.
            Resolved most-specific-first: offer > category > objective > tenant.
        guardrails: { $ref: "#/components/schemas/AutonomyGuardrails" }
        rationale:
          type: string
          description: Why this scope was granted this level. Required for audit.
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    AgentActivity:
      type: object
      required:
        - id
        - timestamp
        - agentId
        - level
        - scope
        - changeType
        - summary
        - outcome
        - guardrailBreached
        - changeSetId
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        agentId: { type: string }
        level:
          type: string
          enum: [L0, L1, L2, L3, L4]
        scope: { $ref: "#/components/schemas/PolicyScope" }
        changeType:
          type: string
          enum:
            - boost_adjust
            - creative_copy
            - policy_edit
            - offer_create
            - offer_retire
            - flow_edit
            - arbitration_weights
        summary: { type: string }
        outcome:
          type: string
          enum: [suggested, proposed, auto_applied, reverted, blocked]
        guardrailBreached:
          type: [string, "null"]
        changeSetId:
          type: [string, "null"]

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------

    AuthUser:
      type: object
      required:
        - id
        - email
        - name
        - roles
        - permissions
        - tenantId
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [architect, marketer, compliance, analyst, operator, admin]
        permissions:
          type: array
          items: { type: string }
        tenantId: { type: string }
    Denial:
      type: object
      description: >
        Why one candidate was removed. Stable, parseable and translatable,
        which the node's prose `reason` is not — this is what answers "why was
        this action not offered to me" for a single action.
      required: [key, code, ruleId]
      properties:
        key:
          type: string
          description: The candidate this is about.
        code:
          type: string
          description: >
            A closed set, never renamed. NOT_RANKED is not a fault: the
            candidate passed every gate and was beaten.
          enum:
            - ELIGIBILITY_FAILED
            - RELEVANCE_FAILED
            - SUITABILITY_FAILED
            - FREQUENCY_CAP_BREACHED
            - CONSENT_WITHHELD
            - OUT_OF_VALIDITY_WINDOW
            - NOT_ACTIVE
            - NOT_RANKED
        ruleId:
          type: [string, "null"]
          description: >
            The targeting or frequency policy that did it, where one is
            identifiable. Null for codes that are properties of the candidate
            rather than of a rule. Always present, never omitted — an optional
            key would mean two engines each deciding when to drop it, and the
            canonical form differs if they disagree.

    Elimination:
      type: object
      description: One node's verdict on the candidate set, in execution order.
      required: [nodeId, nodeType, reason, denials, survived]
      properties:
        nodeId:
          type: string
        nodeType:
          type: string
        reason:
          type: string
          description: Human sentence for the trace view. Not stable; do not parse it.
        denials:
          type: array
          description: >
            One entry per candidate removed here, sorted by key. Sorted rather
            than left in evaluation order because within a node the removals
            are simultaneous, so order carries no information and would only be
            a way for two engines to disagree.
          items:
            $ref: '#/components/schemas/Denial'
        survived:
          type: array
          items:
            type: string

    ScoreBreakdown:
      type: object
      description: >
        Every term the engine produces for a candidate, and the priority the
        ranking function computed from them. All terms are present whichever
        function ran: a term appearing only when some function asks for it
        would make the decision shape depend on the ranking config, and two
        decisions from one tenant would hash over different structures.
      required: [propensity, value, boost, context, cost, priority]
      properties:
        propensity:
          type: number
        value:
          type: number
        boost:
          type: number
        context:
          type: number
        cost:
          type: number
          description: Delivery cost, normalised on the same scale as value.
        priority:
          type: number

    OutcomeEvent:
      type: object
      description: >
        Something that happened to a decision afterwards. Storage only —
        nothing learns from these yet, and a table that quietly fed a model
        would be the opposite of the point.
      required: [decisionId, type, occurredAt, valueMinor]
      properties:
        decisionId:
          type: string
        type:
          type: string
          enum: [impression, click, acceptance, rejection, conversion]
        occurredAt:
          type: string
          format: date-time
        valueMinor:
          type: [integer, 'null']
          description: >
            Realised value in minor units, where the outcome carries one. Null
            rather than zero when there is none: a click is not a conversion
            worth nothing, and averaging over zeros would say it was.
        detail:
          type: object
          description: Whatever the channel reported. Never read by the engine.
          additionalProperties: true

    ConsentState:
      type: object
      required: [marketing, profiling, thirdParty]
      properties:
        marketing:
          type: boolean
        profiling:
          type: boolean
        thirdParty:
          type: boolean

    Decision:
      type: object
      description: A decision as it appears in search results, without the trace.
      required:
        [id, artifactId, artifactVersion, tenantId, customerId, timestamp, channel,
         placement, winner, winnerOfferId, candidateCount, totalMs]
      properties:
        id:
          type: string
        artifactId:
          type: string
        artifactVersion:
          type: string
        tenantId:
          type: string
        customerId:
          type: string
          description: Pseudonymised customer reference
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
        placement:
          type: string
        winner:
          type: [string, 'null']
          description: Action key of the winning candidate, or null if suppressed
        winnerOfferId:
          type: [string, 'null']
        candidateCount:
          type: integer
        totalMs:
          type: number

    DecisionRecord:
      type: object
      description: |
        A decision plus the full reasoning behind it. Everything here except
        `timings` is reproducible: `chainHash` covers only that reproducible
        half, which is what makes replay a byte-comparison rather than a
        judgement call.
      required:
        [id, artifactId, artifactVersion, tenantId, customerId, timestamp, channel,
         placement, winner, winnerOfferId, candidateCount, totalMs,
         eliminations, scores, arbitration, timings, constraintsApplied,
         consentState, chainHash, inputSnapshotHash]
      properties:
        id:
          type: string
        artifactId:
          type: string
        artifactVersion:
          type: string
        tenantId:
          type: string
        customerId:
          type: string
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
        placement:
          type: string
        winner:
          type: [string, 'null']
        winnerOfferId:
          type: [string, 'null']
        candidateCount:
          type: integer
        totalMs:
          type: number
        eliminations:
          type: array
          items:
            $ref: '#/components/schemas/Elimination'
        scores:
          type: object
          description: Score breakdown per candidate action key
          additionalProperties:
            $ref: '#/components/schemas/ScoreBreakdown'
        arbitration:
          type: object
          required: [formula, utility, winner, runnerUp]
          properties:
            formula:
              type: string
            utility:
              type: object
              description: >
                Which ranking function produced these priorities. In the hashed
                decision because a decision has to identify every version that
                produced it — without this, two decisions ranked by different
                functions over the same catalogue are indistinguishable after
                the fact.
              required: [id, version]
              properties:
                id: { type: string }
                version: { type: string }
            winner:
              type: [string, 'null']
            runnerUp:
              type: [string, 'null']
        timings:
          type: object
          description: Measured, not reproducible. Excluded from the chain hash.
          additionalProperties:
            type: number
        constraintsApplied:
          type: array
          items:
            type: string
        consentState:
          $ref: '#/components/schemas/ConsentState'
        creativeId:
          type: [string, 'null']
        sourceBindings:
          type: array
          description: Which connector supplied which input field. Reproducible.
          items:
            $ref: '#/components/schemas/SourceBinding'
        sourceCalls:
          type: array
          description: |
            What the integrations did on the wire. Measured, so absent on a
            replayed trace - replay calls no connectors.
          items:
            $ref: '#/components/schemas/SourceCall'
        chainHash:
          type: string
          description: sha256 over the reproducible half of the decision
        inputSnapshotHash:
          type: string

    ReplayResult:
      type: object
      description: The outcome of re-executing a historical decision.
      required:
        [identical, decisionId, replayedAt, artifactVersion, originalWinner,
         replayedWinner, originalChainHash, replayedChainHash, diff]
      properties:
        identical:
          type: boolean
          description: True when the two chain hashes match exactly
        decisionId:
          type: string
        replayedAt:
          type: string
          format: date-time
        artifactVersion:
          type: string
        originalWinner:
          type: [string, 'null']
        replayedWinner:
          type: [string, 'null']
        originalChainHash:
          type: string
        replayedChainHash:
          type: string
        diff:
          type: array
          description: Empty when identical is true
          items:
            type: object
            required: [path]
            properties:
              path:
                type: string
              original: {}
              replayed: {}

    Taxonomy:
      type: object
      description: The whole offer catalogue - Objective > Category > Offer.
      required: [objectives, categories, offers]
      properties:
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/Objective'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'

    OfferDetail:
      type: object
      description: An offer with everything needed to render its page.
      required: [offer, creatives, policies, autonomy]
      properties:
        offer:
          $ref: '#/components/schemas/Offer'
        creatives:
          type: array
          items:
            $ref: '#/components/schemas/Creative'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/TargetingPolicy'
        autonomy:
          oneOf:
            - $ref: '#/components/schemas/AutonomySetting'
            - type: 'null'
          description: Effective autonomy for this scope, or null if none resolves

    ChangeSetSimulation:
      type: object
      required: [ran, passed, populationSize, projectedMarginDelta, biasRatio, notes]
      properties:
        ran:
          type: boolean
        passed:
          type: boolean
        populationSize:
          type: integer
        projectedMarginDelta:
          type: string
        biasRatio:
          type: number
          description: Ratio between best and worst treated group. 1.0 is parity.
        notes:
          type: string

    ChangeSet:
      type: object
      description: A proposed change awaiting approval, from a person or an agent.
      required:
        [id, title, description, status, autonomyTier, requestedBy, requestedAt,
         decidedBy, decidedAt, decisionReason, targetScope, changeType, diff, simulation]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn]
        autonomyTier:
          type: integer
          enum: [1, 2, 3]
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        decidedBy:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
        decisionReason:
          type: [string, 'null']
        targetScope:
          $ref: '#/components/schemas/PolicyScope'
        changeType:
          type: string
        diff:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                type: string
              after:
                type: string
        simulation:
          oneOf:
            - $ref: '#/components/schemas/ChangeSetSimulation'
            - type: 'null'

    AuditEvent:
      type: object
      description: One entry in the append-only log. Every write produces one.
      required: [id, timestamp, actor, actorType, eventType, scope, summary, changeSetId]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        actorType:
          type: string
          enum: [human, agent, system]
        eventType:
          type: string
        scope:
          type: string
        summary:
          type: string
        changeSetId:
          type: [string, 'null']

    Diagnostic:
      type: object
      description: One compiler finding, with the remedy where there is one.
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        at:
          type: string
          description: Node id the finding attaches to
        message:
          type: string
        remedy:
          type: string

    CostManifest:
      type: object
      description: What the compiler predicts this flow will cost to run.
      required:
        [nodeCount, criticalPathMs, worstCaseMs, modelInvocations, latencyBudgetMs, withinBudget]
      properties:
        nodeCount:
          type: integer
        criticalPathMs:
          type: number
          description: Longest path through the DAG, not the sum of all nodes
        worstCaseMs:
          type: number
        modelInvocations:
          type: array
          items:
            type: object
            required: [nodeId, model]
            properties:
              nodeId:
                type: string
              model:
                type: string
        latencyBudgetMs:
          type: number
        withinBudget:
          type: boolean

    CompileResult:
      type: object
      required: [ok, diagnostics, artifact]
      properties:
        ok:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        artifact:
          oneOf:
            - type: object
              required: [packageVersions, artifactHash, compiledAt, costManifest]
              properties:
                packageVersions:
                  type: object
                  additionalProperties:
                    type: string
                artifactHash:
                  type: string
                compiledAt:
                  type: string
                  format: date-time
                costManifest:
                  $ref: '#/components/schemas/CostManifest'
            - type: 'null'
          description: Null when compilation failed

    FlowNode:
      type: object
      description: One node in a decision graph.
      required: [id, type, label, description, estimatedMs, position]
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        description:
          type: string
        estimatedMs:
          type: number
        policyIds:
          type: array
          items:
            type: string
        connectorIds:
          type: array
          description: Connectors a source node draws on. Their latency joins the critical path.
          items:
            type: string
        model:
          type: object
          required: [id, version]
          properties:
            id:
              type: string
            version:
              type: string
              description: Pinned. An unpinned model fails compilation.
        formula:
          type: string
        position:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number

    FlowEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string

    PublishedVersion:
      type: object
      description: One immutable version in the registry.
      required: [flowName, version, artifact, publishedAt, publishedBy, warnings]
      properties:
        flowName:
          type: string
        version:
          type: string
        artifact:
          $ref: '#/components/schemas/CompiledDecisionFlow'
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        warnings:
          type: array
          description: |
            Kept with the version rather than discarded on success. A flow
            that published near its latency budget is a different thing to
            explain in six months than one that published clean.
          items:
            $ref: '#/components/schemas/Diagnostic'

    EnvironmentState:
      type: object
      description: What an environment is running, and what rollback returns to.
      required: [environment, activeVersion, previousVersion, shadowVersion, promotedAt, promotedBy]
      properties:
        environment:
          type: string
        activeVersion:
          type: [string, 'null']
        previousVersion:
          type: [string, 'null']
          description: Null when there is nothing to roll back to.
        shadowVersion:
          type: [string, 'null']
          description: >
            A version running beside the active one and deciding nothing. Its
            output never reaches a customer — the active version's answer is
            always the one returned. What the shadow produces is compared and
            recorded, which is how a migration is evidenced rather than
            asserted. Null when nothing is shadowing, which is the normal state.
        promotedAt:
          type: [string, 'null']
        promotedBy:
          type: [string, 'null']

    PublishOutcome:
      type: object
      description: |
        The result of a publish. `published` stored a new version, `unchanged`
        found byte-identical content already there, and `rejected` stored
        nothing - either the flow did not compile, or the version already
        holds different content.
      required: [status, diagnostics]
      properties:
        status:
          type: string
          enum: [published, unchanged, rejected]
        reason:
          type: string
          enum: [compilation, immutable]
          description: Present when status is `rejected`.
        artifact:
          oneOf:
            - $ref: '#/components/schemas/CompiledDecisionFlow'
            - type: 'null'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        existingHash:
          type: string
          description: Present when refused as immutable.
        attemptedHash:
          type: string
          description: Present when refused as immutable.

    ShadowReport:
      type: object
      required:
        - flowName
        - activeVersion
        - shadowVersion
        - compared
        - agreed
        - agreementRate
        - topDivergences
        - shadowMsP50
        - shadowMsP95
      properties:
        flowName: { type: string }
        activeVersion: { type: [string, 'null'] }
        shadowVersion: { type: [string, 'null'] }
        compared: { type: integer }
        agreed: { type: integer }
        agreementRate:
          type: number
          description: 0 when nothing has been compared, never 1.
        topDivergences:
          type: array
          items:
            type: object
            required: [kind, summary, count]
            properties:
              kind:
                type: string
                enum: [winner, ranking, reasons]
              summary: { type: string }
              count: { type: integer }
        shadowMsP50: { type: number }
        shadowMsP95:
          type: number
          description: >
            The tail is the number that matters: a shadow whose p95 is 100ms is
            not free, whatever its median says.

    RegistryEvent:
      type: object
      description: One entry in the registry's append-only log.
      required: [seq, at, actor, type, tenantId, flowName, version, summary]
      properties:
        seq:
          type: integer
          description: Monotonic. The order is a fact, not a sort key.
        at:
          type: string
          format: date-time
        actor:
          type: string
        type:
          type: string
          enum: [ArtifactPublished, PublishRejected, VersionPromoted, VersionRolledBack]
        tenantId:
          type: string
        flowName:
          type: string
        version:
          type: string
        environment:
          type: string
        summary:
          type: string
        diagnostics:
          type: array
          description: Present on PublishRejected.
          items:
            $ref: '#/components/schemas/Diagnostic'

    FieldBinding:
      type: object
      description: One field a connector supplies, and where it lives in the response.
      required: [field, path, type]
      properties:
        field:
          type: string
          description: The name the field takes in the decision input
        path:
          type: string
          description: Dotted path into the connector's response payload
        type:
          type: string
          enum: [string, number, boolean]
        defaultValue:
          description: Used when the connector fails and its failure mode is `default`
          oneOf:
            - type: string
            - type: number
            - type: boolean

    Connector:
      type: object
      description: |
        A configured route to data the platform does not hold. Used at decision
        time: a flow's source node names the connectors it needs, resolution
        fetches them before execution, and the values land in the input the
        engine hashes. Replay never calls a connector - it replays against the
        recorded snapshot.
      required:
        [id, name, kind, description, target, declaredP95Ms, timeoutMs, onFailure,
         cacheTtlSeconds, provides, active, updatedAt, updatedBy]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [rest, feature-store, static]
        description:
          type: string
        target:
          type: string
          description: Endpoint, feature-store namespace, or empty for `static`
        declaredP95Ms:
          type: number
          description: |
            Declared, not measured. The compiler adds it to the critical path, so
            a connector that cannot fit the latency budget fails compilation
            rather than failing in production.
        timeoutMs:
          type: number
        onFailure:
          type: string
          enum: [fail, omit, default]
        cacheTtlSeconds:
          type: integer
          description: 0 disables caching. Caching is measured, never hashed.
        provides:
          type: array
          items:
            $ref: '#/components/schemas/FieldBinding'
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    SourceBinding:
      type: object
      description: Which connector supplied a field. Reproducible; part of the hashed decision.
      required: [field, connectorId, nodeId]
      properties:
        field:
          type: string
        connectorId:
          type: string
        nodeId:
          type: string

    SourceCall:
      type: object
      description: What an integration actually did. Measured; never hashed, absent on replay.
      required: [connectorId, ms, cacheHit, outcome, fields]
      properties:
        connectorId:
          type: string
        ms:
          type: number
        cacheHit:
          type: boolean
        outcome:
          type: string
          enum: [ok, timeout, error, skipped]
        fields:
          type: array
          items:
            type: string
        detail:
          type: string

    ArtifactSummary:
      type: object
      description: |
        A flow as the console lists and renders it. Distinct from
        CompiledArtifact, which is the registry's immutable executable form.
      required:
        [id, name, description, activeVersion, versions, nodeCount,
         estimatedP95LatencyMs, status, candidateKeys, nodes, edges, updatedAt, updatedBy]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        activeVersion:
          type: string
        versions:
          type: array
          items:
            type: string
        nodeCount:
          type: integer
        estimatedP95LatencyMs:
          type: number
        status:
          type: string
        candidateKeys:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FlowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/FlowEdge'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        compileOk:
          type: [boolean, 'null']
          description: Compile summary. Present on the list endpoint.
        errorCount:
          type: integer
        warningCount:
          type: integer
        compilation:
          oneOf:
            - $ref: '#/components/schemas/CompileResult'
            - type: 'null'
          description: Full compiler output. Present on the detail endpoint.

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    FlowName:
      name: flowName
      in: path
      required: true
      schema:
        type: string
    ChangeSetId:
      name: changeSetId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum rows to return. The response total is unpaged.
      schema:
        type: integer
        minimum: 1
        default: 50

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      summary: Exchange credentials for a session token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Wrong email or password

  /auth/session:
    get:
      summary: Resolve the current session
      operationId: getSession
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: No valid session. The only status that clears the token.

  # ---------------------------------------------------------------------------
  # Offer catalogue
  # ---------------------------------------------------------------------------
  /taxonomy/{tenantId}:
    get:
      summary: The whole offer taxonomy in one call
      operationId: getTaxonomy
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Objectives, categories and offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'

  /offers/{tenantId}:
    get:
      summary: List offers, filtered
      operationId: listOffers
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: objectiveId
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, retired]
        - name: q
          in: query
          description: Free-text match on name, key or tag
          schema:
            type: string
      responses:
        '200':
          description: Matching offers
          content:
            application/json:
              schema:
                type: object
                required: [offers, total]
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
                  total:
                    type: integer

    post:
      summary: Create an offer
      operationId: createOffer
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '403':
          description: Caller lacks edit:offers

  /offers/{tenantId}/{offerId}:
    get:
      summary: An offer with its creatives, policies and effective autonomy
      operationId: getOffer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Offer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetail'
        '404':
          description: No such offer

    put:
      summary: Update an offer
      operationId: updateOffer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '403':
          description: Caller lacks edit:offers

  /creatives/{tenantId}/{offerId}:
    get:
      summary: Creatives for an offer, one per channel
      operationId: listCreatives
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Creatives
          content:
            application/json:
              schema:
                type: object
                required: [creatives]
                properties:
                  creatives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Creative'

  # ---------------------------------------------------------------------------
  # Targeting policy, frequency policy, arbitration
  # ---------------------------------------------------------------------------
  /targeting-policies/{tenantId}:
    get:
      summary: Eligibility, relevance and suitability policies
      operationId: listTargetingPolicies
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: kind
          in: query
          schema:
            type: string
            enum: [eligibility, relevance, suitability]
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/TargetingPolicy'

  /frequency-policies/{tenantId}:
    get:
      summary: Frequency caps and cooldowns
      operationId: listFrequencyPolicies
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Frequency policies
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/FrequencyPolicy'

  /arbitration/{tenantId}:
    get:
      summary: Arbitration weights and the boosts in force
      operationId: getArbitrationConfig
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Config and boosts
          content:
            application/json:
              schema:
                type: object
                required: [config, boosts]
                properties:
                  config:
                    $ref: '#/components/schemas/ArbitrationConfig'
                  boosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Boost'

    put:
      summary: Publish new arbitration weights
      operationId: updateArbitrationConfig
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weights]
              properties:
                weights:
                  type: object
                  required: [propensity, value, boost, context]
                  properties:
                    propensity:
                      type: number
                    value:
                      type: number
                    boost:
                      type: number
                    context:
                      type: number
      responses:
        '200':
          description: Published, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArbitrationConfig'
        '403':
          description: Caller lacks edit:arbitration

  # ---------------------------------------------------------------------------
  # Agentic AI
  # ---------------------------------------------------------------------------
  /autonomy/{tenantId}:
    get:
      summary: Autonomy settings, most specific scope wins at resolution time
      operationId: listAutonomySettings
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutonomySetting'

    put:
      summary: Change an autonomy level or its guardrails
      operationId: updateAutonomySetting
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutonomySetting'
      responses:
        '200':
          description: Updated, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomySetting'
        '403':
          description: Caller lacks edit:autonomy

  /agent-activity/{tenantId}:
    get:
      summary: What the agents did, and what the guardrails stopped
      operationId: listAgentActivity
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: outcome
          in: query
          schema:
            type: string
            enum: [suggested, proposed, auto_applied, reverted, blocked]
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity, newest first
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties:
                  activity:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentActivity'

  # ---------------------------------------------------------------------------
  # Decisions and traces
  # ---------------------------------------------------------------------------
  /decisions/search:
    get:
      summary: Search decisions
      description: |
        GET rather than POST: the console keeps search state in the URL, so a
        filtered view has to be linkable and back-button-able.
      operationId: searchDecisions
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: outcome
          in: query
          schema:
            type: string
            enum: [offered, suppressed]
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching decisions, plus the unpaged total
          content:
            application/json:
              schema:
                type: object
                required: [decisions, total]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
                  total:
                    type: integer
                    description: Matches before the limit, not the page size

  /decisions:
    post:
      summary: Make a decision
      description: |
        Execute a flow against a request and return the trace.

        Integrations are resolved before the deterministic core runs and their
        values arrive in `request.input`; this operation does not fetch them.
        A caller that wants resolution asks for it by supplying the fields, or
        by calling a service configured with a gateway.

        `occurredAt` is required and is never defaulted to the current time.
        Defaulting it would make a decision depend on when it was made, which
        is the one thing replay cannot tolerate.

        Two implementations serve this: the console's development store, and
        the JVM service in `engines/kotlin`. Both produce the same chain hash
        for the same input — see docs/conformance/service-cases.json.
      operationId: executeDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifactId, request]
              properties:
                artifactId:
                  type: string
                request:
                  type: object
                  required: [tenantId, customerId, channel, placement, occurredAt, input]
                  properties:
                    tenantId:
                      type: string
                    customerId:
                      type: string
                    channel:
                      type: string
                    placement:
                      type: string
                    occurredAt:
                      type: string
                      format: date-time
                      description: An input, never the clock.
                    input:
                      type: object
                      description: Customer and context attributes, already resolved.
                    contactHistory:
                      type: object
                    consent:
                      type: object
                    idempotencyKey:
                      type: string
                      description: >
                        Makes a retry safe. The same key with the same request
                        returns the original decision without re-executing; the
                        same key with a *different* request is a 409, because
                        the caller reused a token for a different question and
                        answering quietly would hand them a decision about
                        someone else's customer.

                        Excluded from the request hash — it identifies the
                        attempt, not the question. Scoped per tenant.
                      example: 4f9a1c22-8b1e-4f2a-9c31-1d0f7a6b5c2e
                    correlationId:
                      type: string
                      description: >
                        Tracing id, echoed back in the measured half of the
                        trace. Never hashed, and excluded from the request hash:
                        it differs on every retry, so including it would make
                        each retry a new request.
      responses:
        '200':
          description: >
            The decision and its trace. A response to a repeated idempotency
            key carries `Idempotent-Replay: true` and is the original decision,
            not a re-execution that happens to agree.
          content:
            application/json:
              schema:
                type: object
                required: [id, decision, chainHash]
                properties:
                  id:
                    type: string
                    description: Content-addressed. The first 16 characters of the chain hash.
                  decision:
                    type: object
                    description: The reproducible half, exactly as hashed.
                  chainHash:
                    type: string
        '400':
          description: Malformed request, or an artifact the engine cannot execute
        '409':
          description: >
            The idempotency key was already used for a different request.
            Deliberately not a 200 with the stored decision: that would answer a
            question the caller did not ask, and look successful doing it.
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error:
                    type: string
                    enum: [idempotency_conflict]
                  message:
                    type: string
        '404':
          description: No such artifact

  /decisions/{decisionId}/trace:
    get:
      summary: The full reasoning behind one decision
      operationId: getDecisionRecord
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '404':
          description: No such decision

  /decisions/{decisionId}/replay:
    post:
      summary: Re-execute a historical decision and compare it to the original
      operationId: replayDecision
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            The replay outcome. `identical` is the claim the platform is making;
            when it is false, `diff` says exactly where reproduction broke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
        '404':
          description: No such decision

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  /change-sets:
    get:
      summary: The approval queue
      operationId: listChangeSets
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, withdrawn]
      responses:
        '200':
          description: Change sets, newest first
          content:
            application/json:
              schema:
                type: object
                required: [changeSets, total]
                properties:
                  changeSets:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeSet'
                  total:
                    type: integer

    post:
      summary: Propose a change
      operationId: createChangeSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSet'
      responses:
        '201':
          description: Created, pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'

  /change-sets/{changeSetId}:
    get:
      summary: A change set with its diff and simulation
      operationId: getChangeSet
      parameters:
        - $ref: '#/components/parameters/ChangeSetId'
      responses:
        '200':
          description: Change set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'
        '404':
          description: No such change set

  /change-sets/{changeSetId}/approve:
    post:
      summary: Approve a change set, applying its diff
      operationId: approveChangeSet
      parameters:
        - $ref: '#/components/parameters/ChangeSetId'
      responses:
        '200':
          description: Approved. The diff is applied and the decision audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'
        '403':
          description: Caller lacks approve:changes

  /change-sets/{changeSetId}/reject:
    post:
      summary: Reject a change set
      operationId: rejectChangeSet
      parameters:
        - $ref: '#/components/parameters/ChangeSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected, with the reason recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'
        '403':
          description: Caller lacks approve:changes

  /outcomes/{tenantId}/{decisionId}:
    post:
      summary: Record what happened to a decision
      description: |
        Links an impression, click, acceptance, rejection or conversion back to
        the decision that produced it.

        The decision must already exist. An outcome for a decision nobody made
        is a mis-routed event or a mis-typed id, and storing it would put a row
        in the ledger that can never be joined to anything — the kind of orphan
        found years later when someone tries to measure uplift.

        Append-only, like the decision it points at. Storage only: learning
        from outcomes is a later gate.
      operationId: recordOutcome
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: decisionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, occurredAt]
              properties:
                type:
                  type: string
                  enum: [impression, click, acceptance, rejection, conversion]
                occurredAt:
                  type: string
                  format: date-time
                valueMinor:
                  type: [integer, 'null']
                detail:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEvent'
        '404':
          description: No such decision, so nothing to attach the outcome to

    get:
      summary: Outcomes recorded against a decision
      operationId: listOutcomes
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: decisionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Outcomes, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [outcomes]
                properties:
                  outcomes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutcomeEvent'

  /audit:
    get:
      summary: The append-only log of every write
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events, total]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  total:
                    type: integer

  /connectors/{tenantId}:
    get:
      summary: Configured integrations
      operationId: listConnectors
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connector'

  /connectors/{tenantId}/{connectorId}:
    put:
      summary: Activate, deactivate or retune a connector
      operationId: updateConnector
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector'
      responses:
        '200':
          description: Updated, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '403':
          description: Caller lacks edit:integrations

  # ---------------------------------------------------------------------------
  # Flows as the console reads them
  # ---------------------------------------------------------------------------
  /artifacts/{tenantId}:
    get:
      summary: List flows with their compile status
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Flows
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtifactSummary'

  /artifacts/{tenantId}/{artifactId}:
    get:
      summary: One flow, with its graph and full compiler output
      operationId: getArtifactSummary
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSummary'
        '404':
          description: No such flow

  # ---------------------------------------------------------------------------
  # PROPOSED - registered in docs/gaps.md, not built.
  #
  # These are the platform contracts the console will need. Nothing serves them
  # yet, so the contract test skips them by design: it asserts that everything
  # NOT in this section is live, which is what stops the list from rotting.
  # ---------------------------------------------------------------------------
  /registry/{tenantId}:
    get:
      summary: Flows in the registry
      operationId: listRegistryFlows
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Registered flow names
          content:
            application/json:
              schema:
                type: object
                required: [flows]
                properties:
                  flows:
                    type: array
                    items:
                      type: string

  /registry/{tenantId}/{flowName}:
    get:
      summary: Published versions and where each is running
      operationId: getRegistryEntry
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      responses:
        '200':
          description: Versions and environment state
          content:
            application/json:
              schema:
                type: object
                required: [flowName, versions, environments]
                properties:
                  flowName:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedVersion'
                  environments:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvironmentState'
        '404':
          description: No such flow in the registry

    post:
      summary: Publish a version
      description: |
        Compiles first. A flow with compilation errors is refused and
        nothing is stored, so it cannot be promoted and cannot reach execution.
        The refusal is recorded: an audit that only shows what succeeded cannot
        answer whether anyone tried to ship something.

        Publishing does not activate. A published version sits in the registry
        until it is promoted to an environment.

        Republishing byte-identical content under the same version is a no-op
        and returns `unchanged`. Different content under a published version is
        refused: a version is bound to an artifact hash.
      operationId: publishArtifact
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, source]
              properties:
                version:
                  type: string
                source:
                  type: object
                  description: The flow as authored, before compilation.
      responses:
        '201':
          description: Published, or unchanged if the content was already there
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishOutcome'
        '409':
          description: Refused - compilation errors, or the version holds different content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishOutcome'
        '403':
          description: Caller lacks publish:flows

  /registry/{tenantId}/{flowName}/promote:
    post:
      summary: Point an environment at a published version
      operationId: promoteVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, environment]
              properties:
                version:
                  type: string
                environment:
                  type: string
      responses:
        '200':
          description: Promoted, and written to the registry log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '404':
          description: That version was never published
        '409':
          description: That version is already active in this environment
        '403':
          description: Caller lacks promote:flows

  /registry/{tenantId}/{flowName}/shadow:
    post:
      summary: Start or stop a shadow
      description: |
        Runs a published version beside the active one, deciding nothing.

        A null `version` stops the shadow. One verb rather than two, because
        "what is shadowing" is one piece of state.

        Refused if the version is already active: comparing a thing with itself
        produces a 100% agreement rate that means nothing, and publishing that
        number would be worse than having none. Also refused where nothing is
        active, since there is no baseline to compare against.

        Gated on `promote:flows` rather than a permission of its own. Deciding
        what runs in production, even beside the active version, is the same
        authority.
      operationId: setShadow
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                version:
                  type: [string, 'null']
                  description: Null stops the shadow.
                environment:
                  type: string
      responses:
        '200':
          description: The environment, with its shadow set or cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '403':
          description: Caller lacks promote:flows
        '404':
          description: No such version
        '409':
          description: >
            Already active, or nothing running to compare against, or no shadow
            to stop.

  /registry/{tenantId}/{flowName}/shadow-report:
    get:
      summary: How the shadow compares to what is running
      description: |
        Agreement rate and the most common divergences, for the pair currently
        configured. Comparisons from an earlier shadow are excluded: they
        describe a different question, and folding them in would average across
        two migrations.

        Three separate comparisons, not one boolean — a migration that changes
        *why* without changing *what* is exactly the case a regulator asks
        about, and agreement on the winner alone would hide it:

        - `winner` — did it choose the same action?
        - `ranking` — did it order the candidates the same way?
        - `reasons` — did it deny the same candidates for the same coded reason?

        Zero comparisons reports a 0% agreement rate, not 100%. Nothing has
        agreed yet.

        `shadowMsP50` and `shadowMsP95` are what the shadow cost. It runs after
        the response is sent and never enters the active latency budget, so
        these are published rather than hidden — a cost that is real but paid
        somewhere the caller does not wait for it.
      operationId: getShadowReport
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowReport'
        '404':
          description: >
            No such flow in the registry. A flow that failed to compile was
            never stored, and a zeroed report about it would read as a shadow
            that is merely idle rather than one that cannot exist.

  /registry/{tenantId}/{flowName}/rollback:
    post:
      summary: Return an environment to the version it ran before
      description: |
        The rollback becomes the new active version and the version it replaced
        becomes the rollback target, so rolling back twice returns to where you
        started rather than walking backwards through history.
      operationId: rollbackVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment:
                  type: string
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '409':
          description: Nothing to roll back to
        '403':
          description: Caller lacks promote:flows

  /registry/{tenantId}/events:
    get:
      summary: The registry's append-only log
      description: |
        Publishes, promotions, rollbacks and refusals, newest first. Ordered by
        sequence rather than timestamp: two events can share a timestamp, and
        the sequence is what makes the order a fact.
      operationId: listRegistryEvents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: flowName
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistryEvent'

  /simulations:
    post:
      summary: Run a population through a compiled flow
      operationId: simulateDecisionFlow
      x-metis-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifactId, populationSize]
              properties:
                artifactId:
                  type: string
                version:
                  type: string
                populationSize:
                  type: integer
      responses:
        '200':
          description: Aggregated outcomes, distribution and bias metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSetSimulation'

  /counterfactuals:
    post:
      summary: Find the smallest input change that flips a decision
      operationId: getCounterfactual
      x-metis-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionId]
              properties:
                decisionId:
                  type: string
                targetWinner:
                  type: string
      responses:
        '200':
          description: The minimal diff, or none if the outcome cannot be flipped
          content:
            application/json:
              schema:
                type: object
                required: [found, changes]
                properties:
                  found:
                    type: boolean
                  changes:
                    type: array
                    items:
                      type: object
                      required: [field, from, to]
                      properties:
                        field:
                          type: string
                        from: {}
                        to: {}
