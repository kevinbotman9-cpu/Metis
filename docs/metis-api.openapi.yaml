  /experiments/{tenantId}/{experimentId}:
    put:
      summary: Edit an experiment, or start and stop it
      description: |
        Arms and key are editable only while the experiment is a draft. Once it
        is running they are frozen: an arm is recomputed from the customer
        reference when a decision is explained later, and reweighting would make
        every recomputed arm disagree with the one that actually applied.
      operationId: updateExperiment
