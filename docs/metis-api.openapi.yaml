openapi: 3.1.0
info:
  title: METIS Execution Plane API
  version: 2.0.0
  description: |
    AI-native decision platform API.
    Execution plane: deterministic strategy execution, artifact registry, approval workflow.
  contact:
    name: METIS Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://metis.example.com/api
    description: Production

components:
  schemas:
    CompiledArtifact:
      type: object
      properties:
        id:
          type: string
          description: Artifact ID
        version:
          type: string
          description: Semantic version
        metadata:
          type: object
          properties:
            id:
              type: string
            version:
              type: string
            tenantId:
              type: string
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
            signature:
              type: string
        dirSchema:
          type: object
          description: Decision Intermediate Representation
        costManifest:
          type: object
          properties:
            computeNodes:
              type: integer
            modelInvocations:
              type: array
              items:
                type: string
            externalCalls:
              type: integer
            estimatedP95LatencyMs:
              type: number
        signature:
          type: string

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Minor units, e.g. pence. 3500 = 35.00
        currency:
          type: string
          enum: [GBP, USD, EUR]

    Issue:
      type: object
      required:
        - id
        - name
        - key
        - description
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        key:
          type: string
          description: URL-safe stable key, e.g. "retention"
        description: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Group:
      type: object
      required:
        - id
        - issueId
        - name
        - key
        - description
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        issueId: { type: string }
        name: { type: string }
        key: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ValidityWindow:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt: { type: string, format: date }
        endsAt:
          type: [string, "null"]
          format: date
          description: null means open-ended

    PropositionFinancials:
      type: object
      required:
        - price
        - cost
        - expectedMargin
        - termMonths
        - oneOff
      properties:
        price: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        expectedMargin: { $ref: "#/components/schemas/Money" }
        termMonths: { type: integer }
        oneOff: { type: boolean }

    Proposition:
      type: object
      required:
        - id
        - groupId
        - issueId
        - name
        - key
        - description
        - status
        - financials
        - validity
        - lever
        - policyIds
        - treatmentIds
        - tags
        - createdAt
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        groupId: { type: string }
        issueId:
          type: string
          description: Denormalised from the group for tree and breadcrumb rendering
        name: { type: string }
        key: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [draft, active, paused, retired]
        financials: { $ref: "#/components/schemas/PropositionFinancials" }
        validity: { $ref: "#/components/schemas/ValidityWindow" }
        lever:
          type: number
          description: Business priority multiplier. 1.0 is neutral.
        policyIds:
          type: array
          items: { type: string }
        treatmentIds:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    Treatment:
      type: object
      required:
        - id
        - propositionId
        - name
        - channel
        - content
        - active
        - locale
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        propositionId: { type: string }
        name: { type: string }
        channel:
          type: string
          enum: [email, sms, web, push, outbound_call]
        content:
          type: object
          description: Channel-specific content; shape is discriminated by channel
          additionalProperties: true
        active: { type: boolean }
        locale: { type: string, example: en-GB }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Engagement and contact policy
    # -------------------------------------------------------------------------

    PolicyScope:
      type: object
      required:
        - level
        - targetId
      properties:
        level:
          type: string
          enum: [tenant, issue, group, proposition]
        targetId:
          type: [string, "null"]
          description: null when level is tenant

    PolicyCondition:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: Dotted path into the customer data model
          example: customer.age
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte, in, not_in, contains, exists, not_exists]
        value: {}

    EngagementPolicy:
      type: object
      required:
        - id
        - name
        - kind
        - description
        - conditions
        - scope
        - active
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [eligibility, applicability, suitability]
          description: >-
            eligibility = can we offer it; applicability = should we now;
            suitability = is it right for this customer
        description: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/PolicyCondition" }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContactPolicy:
      type: object
      required:
        - id
        - name
        - description
        - channel
        - maxContacts
        - period
        - cooldownDaysAfterReject
        - scope
        - active
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        channel:
          type: [string, "null"]
          enum: [email, sms, web, push, outbound_call, null]
          description: null applies to every channel
        maxContacts: { type: integer }
        period:
          type: string
          enum: [day, week, month]
        cooldownDaysAfterReject: { type: integer }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        active: { type: boolean }

    # -------------------------------------------------------------------------
    # Arbitration
    # -------------------------------------------------------------------------

    ArbitrationConfig:
      type: object
      required:
        - id
        - tenantId
        - weights
        - formula
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        tenantId: { type: string }
        weights:
          type: object
          description: Exponent weights for Priority = P^wP x V^wV x L^wL x C^wC
          required:
            - propensity
            - value
            - lever
            - context
          properties:
            propensity: { type: number }
            value: { type: number }
            lever: { type: number }
            context: { type: number }
        formula: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    Lever:
      type: object
      required:
        - id
        - name
        - scope
        - value
        - reason
        - validity
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        name: { type: string }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        value:
          type: number
          description: Multiplier. 1.0 is neutral.
        reason: { type: string }
        validity:
          oneOf:
            - { $ref: "#/components/schemas/ValidityWindow" }
            - { type: "null" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    # -------------------------------------------------------------------------
    # Agentic AI autonomy
    # -------------------------------------------------------------------------

    AutonomyGuardrails:
      type: object
      required:
        - maxBlastRadiusPct
        - allowedChangeTypes
        - maxLeverDelta
        - maxBudgetDelta
        - protectedAttributes
        - requireSimulationPass
        - biasGateThreshold
      properties:
        maxBlastRadiusPct:
          type: number
          minimum: 0
          maximum: 100
        allowedChangeTypes:
          type: array
          items:
            type: string
            enum:
              - lever_adjust
              - treatment_copy
              - policy_edit
              - proposition_create
              - proposition_retire
              - strategy_edit
              - arbitration_weights
        maxLeverDelta:
          type: number
          description: Fraction. 0.1 permits +/-10%.
        maxBudgetDelta: { $ref: "#/components/schemas/Money" }
        protectedAttributes:
          type: array
          items: { type: string }
        requireSimulationPass: { type: boolean }
        biasGateThreshold: { type: number }

    AutonomySetting:
      type: object
      required:
        - id
        - scope
        - level
        - guardrails
        - rationale
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        level:
          type: string
          enum: [L0, L1, L2, L3, L4]
          description: >-
            L0 Observe, L1 Assist, L2 Propose, L3 Bounded, L4 Autonomous.
            Resolved most-specific-first: proposition > group > issue > tenant.
        guardrails: { $ref: "#/components/schemas/AutonomyGuardrails" }
        rationale:
          type: string
          description: Why this scope was granted this level. Required for audit.
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    AgentActivity:
      type: object
      required:
        - id
        - timestamp
        - agentId
        - level
        - scope
        - changeType
        - summary
        - outcome
        - guardrailBreached
        - changeRequestId
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        agentId: { type: string }
        level:
          type: string
          enum: [L0, L1, L2, L3, L4]
        scope: { $ref: "#/components/schemas/PolicyScope" }
        changeType:
          type: string
          enum:
            - lever_adjust
            - treatment_copy
            - policy_edit
            - proposition_create
            - proposition_retire
            - strategy_edit
            - arbitration_weights
        summary: { type: string }
        outcome:
          type: string
          enum: [suggested, proposed, auto_applied, reverted, blocked]
        guardrailBreached:
          type: [string, "null"]
        changeRequestId:
          type: [string, "null"]

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------

    AuthUser:
      type: object
      required:
        - id
        - email
        - name
        - roles
        - permissions
        - tenantId
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [architect, marketer, compliance, analyst, operator, admin]
        permissions:
          type: array
          items: { type: string }
        tenantId: { type: string }
    Elimination:
      type: object
      description: One node's verdict on the candidate set, in execution order.
      required: [nodeId, nodeType, reason, eliminated, survived]
      properties:
        nodeId:
          type: string
        nodeType:
          type: string
        reason:
          type: string
        eliminated:
          type: array
          items:
            type: string
        survived:
          type: array
          items:
            type: string

    ScoreBreakdown:
      type: object
      description: The four arbitration terms and the priority they produce.
      required: [propensity, value, lever, context, priority]
      properties:
        propensity:
          type: number
        value:
          type: number
        lever:
          type: number
        context:
          type: number
        priority:
          type: number

    ConsentState:
      type: object
      required: [marketing, profiling, thirdParty]
      properties:
        marketing:
          type: boolean
        profiling:
          type: boolean
        thirdParty:
          type: boolean

    Decision:
      type: object
      description: A decision as it appears in search results, without the trace.
      required:
        [id, artifactId, artifactVersion, tenantId, customerId, timestamp, channel,
         placement, winner, winnerPropositionId, candidateCount, totalMs]
      properties:
        id:
          type: string
        artifactId:
          type: string
        artifactVersion:
          type: string
        tenantId:
          type: string
        customerId:
          type: string
          description: Pseudonymised customer reference
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
        placement:
          type: string
        winner:
          type: [string, 'null']
          description: Action key of the winning candidate, or null if suppressed
        winnerPropositionId:
          type: [string, 'null']
        candidateCount:
          type: integer
        totalMs:
          type: number

    DecisionTrace:
      type: object
      description: |
        A decision plus the full reasoning behind it. Everything here except
        `timings` is reproducible: `chainHash` covers only that reproducible
        half, which is what makes replay a byte-comparison rather than a
        judgement call.
      required:
        [id, artifactId, artifactVersion, tenantId, customerId, timestamp, channel,
         placement, winner, winnerPropositionId, candidateCount, totalMs,
         eliminations, scores, arbitration, timings, constraintsApplied,
         consentState, chainHash, inputSnapshotHash]
      properties:
        id:
          type: string
        artifactId:
          type: string
        artifactVersion:
          type: string
        tenantId:
          type: string
        customerId:
          type: string
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
        placement:
          type: string
        winner:
          type: [string, 'null']
        winnerPropositionId:
          type: [string, 'null']
        candidateCount:
          type: integer
        totalMs:
          type: number
        eliminations:
          type: array
          items:
            $ref: '#/components/schemas/Elimination'
        scores:
          type: object
          description: Score breakdown per candidate action key
          additionalProperties:
            $ref: '#/components/schemas/ScoreBreakdown'
        arbitration:
          type: object
          required: [formula, winner, runnerUp]
          properties:
            formula:
              type: string
            winner:
              type: [string, 'null']
            runnerUp:
              type: [string, 'null']
        timings:
          type: object
          description: Measured, not reproducible. Excluded from the chain hash.
          additionalProperties:
            type: number
        constraintsApplied:
          type: array
          items:
            type: string
        consentState:
          $ref: '#/components/schemas/ConsentState'
        treatmentId:
          type: [string, 'null']
        sourceBindings:
          type: array
          description: Which connector supplied which input field. Reproducible.
          items:
            $ref: '#/components/schemas/SourceBinding'
        sourceCalls:
          type: array
          description: |
            What the integrations did on the wire. Measured, so absent on a
            replayed trace - replay calls no connectors.
          items:
            $ref: '#/components/schemas/SourceCall'
        chainHash:
          type: string
          description: sha256 over the reproducible half of the decision
        inputSnapshotHash:
          type: string

    ReplayResult:
      type: object
      description: The outcome of re-executing a historical decision.
      required:
        [identical, decisionId, replayedAt, artifactVersion, originalWinner,
         replayedWinner, originalChainHash, replayedChainHash, diff]
      properties:
        identical:
          type: boolean
          description: True when the two chain hashes match exactly
        decisionId:
          type: string
        replayedAt:
          type: string
          format: date-time
        artifactVersion:
          type: string
        originalWinner:
          type: [string, 'null']
        replayedWinner:
          type: [string, 'null']
        originalChainHash:
          type: string
        replayedChainHash:
          type: string
        diff:
          type: array
          description: Empty when identical is true
          items:
            type: object
            required: [path]
            properties:
              path:
                type: string
              original: {}
              replayed: {}

    Taxonomy:
      type: object
      description: The whole offer catalogue - Issue > Group > Proposition.
      required: [issues, groups, propositions]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        propositions:
          type: array
          items:
            $ref: '#/components/schemas/Proposition'

    PropositionDetail:
      type: object
      description: A proposition with everything needed to render its page.
      required: [proposition, treatments, policies, autonomy]
      properties:
        proposition:
          $ref: '#/components/schemas/Proposition'
        treatments:
          type: array
          items:
            $ref: '#/components/schemas/Treatment'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/EngagementPolicy'
        autonomy:
          oneOf:
            - $ref: '#/components/schemas/AutonomySetting'
            - type: 'null'
          description: Effective autonomy for this scope, or null if none resolves

    ChangeRequestSimulation:
      type: object
      required: [ran, passed, populationSize, projectedMarginDelta, biasRatio, notes]
      properties:
        ran:
          type: boolean
        passed:
          type: boolean
        populationSize:
          type: integer
        projectedMarginDelta:
          type: string
        biasRatio:
          type: number
          description: Ratio between best and worst treated group. 1.0 is parity.
        notes:
          type: string

    ChangeRequest:
      type: object
      description: A proposed change awaiting approval, from a person or an agent.
      required:
        [id, title, description, status, autonomyTier, requestedBy, requestedAt,
         decidedBy, decidedAt, decisionReason, targetScope, changeType, diff, simulation]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn]
        autonomyTier:
          type: integer
          enum: [1, 2, 3]
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        decidedBy:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
        decisionReason:
          type: [string, 'null']
        targetScope:
          $ref: '#/components/schemas/PolicyScope'
        changeType:
          type: string
        diff:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                type: string
              after:
                type: string
        simulation:
          oneOf:
            - $ref: '#/components/schemas/ChangeRequestSimulation'
            - type: 'null'

    AuditEvent:
      type: object
      description: One entry in the append-only log. Every write produces one.
      required: [id, timestamp, actor, actorType, eventType, scope, summary, changeRequestId]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        actorType:
          type: string
          enum: [human, agent, system]
        eventType:
          type: string
        scope:
          type: string
        summary:
          type: string
        changeRequestId:
          type: [string, 'null']

    Diagnostic:
      type: object
      description: One compiler finding, with the remedy where there is one.
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        at:
          type: string
          description: Node id the finding attaches to
        message:
          type: string
        remedy:
          type: string

    CostManifest:
      type: object
      description: What the compiler predicts this strategy will cost to run.
      required:
        [nodeCount, criticalPathMs, worstCaseMs, modelInvocations, latencyBudgetMs, withinBudget]
      properties:
        nodeCount:
          type: integer
        criticalPathMs:
          type: number
          description: Longest path through the DAG, not the sum of all nodes
        worstCaseMs:
          type: number
        modelInvocations:
          type: array
          items:
            type: object
            required: [nodeId, model]
            properties:
              nodeId:
                type: string
              model:
                type: string
        latencyBudgetMs:
          type: number
        withinBudget:
          type: boolean

    CompileResult:
      type: object
      required: [ok, diagnostics, artifact]
      properties:
        ok:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        artifact:
          oneOf:
            - type: object
              required: [packageVersions, artifactHash, compiledAt, costManifest]
              properties:
                packageVersions:
                  type: object
                  additionalProperties:
                    type: string
                artifactHash:
                  type: string
                compiledAt:
                  type: string
                  format: date-time
                costManifest:
                  $ref: '#/components/schemas/CostManifest'
            - type: 'null'
          description: Null when compilation failed

    DirNode:
      type: object
      description: One node in a decision graph.
      required: [id, type, label, description, estimatedMs, position]
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        description:
          type: string
        estimatedMs:
          type: number
        policyIds:
          type: array
          items:
            type: string
        connectorIds:
          type: array
          description: Connectors a source node draws on. Their latency joins the critical path.
          items:
            type: string
        model:
          type: object
          required: [id, version]
          properties:
            id:
              type: string
            version:
              type: string
              description: Pinned. An unpinned model fails compilation.
        formula:
          type: string
        position:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number

    DirEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string

    FieldBinding:
      type: object
      description: One field a connector supplies, and where it lives in the response.
      required: [field, path, type]
      properties:
        field:
          type: string
          description: The name the field takes in the decision input
        path:
          type: string
          description: Dotted path into the connector's response payload
        type:
          type: string
          enum: [string, number, boolean]
        defaultValue:
          description: Used when the connector fails and its failure mode is `default`
          oneOf:
            - type: string
            - type: number
            - type: boolean

    Connector:
      type: object
      description: |
        A configured route to data the platform does not hold. Used at decision
        time: a strategy's source node names the connectors it needs, resolution
        fetches them before execution, and the values land in the input the
        engine hashes. Replay never calls a connector - it replays against the
        recorded snapshot.
      required:
        [id, name, kind, description, target, declaredP95Ms, timeoutMs, onFailure,
         cacheTtlSeconds, provides, active, updatedAt, updatedBy]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [rest, feature-store, static]
        description:
          type: string
        target:
          type: string
          description: Endpoint, feature-store namespace, or empty for `static`
        declaredP95Ms:
          type: number
          description: |
            Declared, not measured. The compiler adds it to the critical path, so
            a connector that cannot fit the latency budget fails compilation
            rather than failing in production.
        timeoutMs:
          type: number
        onFailure:
          type: string
          enum: [fail, omit, default]
        cacheTtlSeconds:
          type: integer
          description: 0 disables caching. Caching is measured, never hashed.
        provides:
          type: array
          items:
            $ref: '#/components/schemas/FieldBinding'
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    SourceBinding:
      type: object
      description: Which connector supplied a field. Reproducible; part of the hashed decision.
      required: [field, connectorId, nodeId]
      properties:
        field:
          type: string
        connectorId:
          type: string
        nodeId:
          type: string

    SourceCall:
      type: object
      description: What an integration actually did. Measured; never hashed, absent on replay.
      required: [connectorId, ms, cacheHit, outcome, fields]
      properties:
        connectorId:
          type: string
        ms:
          type: number
        cacheHit:
          type: boolean
        outcome:
          type: string
          enum: [ok, timeout, error, skipped]
        fields:
          type: array
          items:
            type: string
        detail:
          type: string

    ArtifactSummary:
      type: object
      description: |
        A strategy as the console lists and renders it. Distinct from
        CompiledArtifact, which is the registry's immutable executable form.
      required:
        [id, name, description, activeVersion, versions, nodeCount,
         estimatedP95LatencyMs, status, candidateKeys, nodes, edges, updatedAt, updatedBy]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        activeVersion:
          type: string
        versions:
          type: array
          items:
            type: string
        nodeCount:
          type: integer
        estimatedP95LatencyMs:
          type: number
        status:
          type: string
        candidateKeys:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DirNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/DirEdge'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        compileOk:
          type: [boolean, 'null']
          description: Compile summary. Present on the list endpoint.
        errorCount:
          type: integer
        warningCount:
          type: integer
        compilation:
          oneOf:
            - $ref: '#/components/schemas/CompileResult'
            - type: 'null'
          description: Full compiler output. Present on the detail endpoint.

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    StrategyName:
      name: strategyName
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum rows to return. The response total is unpaged.
      schema:
        type: integer
        minimum: 1
        default: 50

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      summary: Exchange credentials for a session token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Wrong email or password

  /auth/session:
    get:
      summary: Resolve the current session
      operationId: getSession
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: No valid session. The only status that clears the token.

  # ---------------------------------------------------------------------------
  # Offer catalogue
  # ---------------------------------------------------------------------------
  /taxonomy/{tenantId}:
    get:
      summary: The whole offer taxonomy in one call
      operationId: getTaxonomy
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Issues, groups and propositions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'

  /propositions/{tenantId}:
    get:
      summary: List propositions, filtered
      operationId: listPropositions
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: issueId
          in: query
          schema:
            type: string
        - name: groupId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, retired]
        - name: q
          in: query
          description: Free-text match on name, key or tag
          schema:
            type: string
      responses:
        '200':
          description: Matching propositions
          content:
            application/json:
              schema:
                type: object
                required: [propositions, total]
                properties:
                  propositions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposition'
                  total:
                    type: integer

    post:
      summary: Create a proposition
      operationId: createProposition
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Proposition'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposition'
        '403':
          description: Caller lacks edit:propositions

  /propositions/{tenantId}/{propositionId}:
    get:
      summary: A proposition with its treatments, policies and effective autonomy
      operationId: getProposition
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: propositionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposition detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropositionDetail'
        '404':
          description: No such proposition

    put:
      summary: Update a proposition
      operationId: updateProposition
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: propositionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Proposition'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposition'
        '403':
          description: Caller lacks edit:propositions

  /treatments/{tenantId}/{propositionId}:
    get:
      summary: Treatments for a proposition, one per channel
      operationId: listTreatments
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: propositionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Treatments
          content:
            application/json:
              schema:
                type: object
                required: [treatments]
                properties:
                  treatments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Treatment'

  # ---------------------------------------------------------------------------
  # Engagement policy, contact policy, arbitration
  # ---------------------------------------------------------------------------
  /engagement-policies/{tenantId}:
    get:
      summary: Eligibility, applicability and suitability policies
      operationId: listEngagementPolicies
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: kind
          in: query
          schema:
            type: string
            enum: [eligibility, applicability, suitability]
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/EngagementPolicy'

  /contact-policies/{tenantId}:
    get:
      summary: Frequency caps and cooldowns
      operationId: listContactPolicies
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Contact policies
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactPolicy'

  /arbitration/{tenantId}:
    get:
      summary: Arbitration weights and the levers in force
      operationId: getArbitrationConfig
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Config and levers
          content:
            application/json:
              schema:
                type: object
                required: [config, levers]
                properties:
                  config:
                    $ref: '#/components/schemas/ArbitrationConfig'
                  levers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lever'

    put:
      summary: Publish new arbitration weights
      operationId: updateArbitrationConfig
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weights]
              properties:
                weights:
                  type: object
                  required: [propensity, value, lever, context]
                  properties:
                    propensity:
                      type: number
                    value:
                      type: number
                    lever:
                      type: number
                    context:
                      type: number
      responses:
        '200':
          description: Published, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArbitrationConfig'
        '403':
          description: Caller lacks edit:arbitration

  # ---------------------------------------------------------------------------
  # Agentic AI
  # ---------------------------------------------------------------------------
  /autonomy/{tenantId}:
    get:
      summary: Autonomy settings, most specific scope wins at resolution time
      operationId: listAutonomySettings
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutonomySetting'

    put:
      summary: Change an autonomy level or its guardrails
      operationId: updateAutonomySetting
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutonomySetting'
      responses:
        '200':
          description: Updated, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomySetting'
        '403':
          description: Caller lacks edit:autonomy

  /agent-activity/{tenantId}:
    get:
      summary: What the agents did, and what the guardrails stopped
      operationId: listAgentActivity
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: outcome
          in: query
          schema:
            type: string
            enum: [suggested, proposed, auto_applied, reverted, blocked]
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity, newest first
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties:
                  activity:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentActivity'

  # ---------------------------------------------------------------------------
  # Decisions and traces
  # ---------------------------------------------------------------------------
  /decisions/search:
    get:
      summary: Search decisions
      description: |
        GET rather than POST: the console keeps search state in the URL, so a
        filtered view has to be linkable and back-button-able.
      operationId: searchDecisions
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: outcome
          in: query
          schema:
            type: string
            enum: [offered, suppressed]
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching decisions, plus the unpaged total
          content:
            application/json:
              schema:
                type: object
                required: [decisions, total]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
                  total:
                    type: integer
                    description: Matches before the limit, not the page size

  /decisions:
    post:
      summary: Make a decision
      description: |
        Execute a strategy against a request and return the trace.

        Integrations are resolved before the deterministic core runs and their
        values arrive in `request.input`; this operation does not fetch them.
        A caller that wants resolution asks for it by supplying the fields, or
        by calling a service configured with a gateway.

        `occurredAt` is required and is never defaulted to the current time.
        Defaulting it would make a decision depend on when it was made, which
        is the one thing replay cannot tolerate.

        Two implementations serve this: the console's development store, and
        the JVM service in `engines/kotlin`. Both produce the same chain hash
        for the same input — see docs/conformance/service-cases.json.
      operationId: executeDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifactId, request]
              properties:
                artifactId:
                  type: string
                request:
                  type: object
                  required: [tenantId, customerId, channel, placement, occurredAt, input]
                  properties:
                    tenantId:
                      type: string
                    customerId:
                      type: string
                    channel:
                      type: string
                    placement:
                      type: string
                    occurredAt:
                      type: string
                      format: date-time
                      description: An input, never the clock.
                    input:
                      type: object
                      description: Customer and context attributes, already resolved.
                    contactHistory:
                      type: object
                    consent:
                      type: object
      responses:
        '200':
          description: The decision and its trace
          content:
            application/json:
              schema:
                type: object
                required: [id, decision, chainHash]
                properties:
                  id:
                    type: string
                    description: Content-addressed. The first 16 characters of the chain hash.
                  decision:
                    type: object
                    description: The reproducible half, exactly as hashed.
                  chainHash:
                    type: string
        '400':
          description: Malformed request, or an artifact the engine cannot execute
        '404':
          description: No such artifact

  /decisions/{decisionId}/trace:
    get:
      summary: The full reasoning behind one decision
      operationId: getDecisionTrace
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionTrace'
        '404':
          description: No such decision

  /decisions/{decisionId}/replay:
    post:
      summary: Re-execute a historical decision and compare it to the original
      operationId: replayDecision
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            The replay outcome. `identical` is the claim the platform is making;
            when it is false, `diff` says exactly where reproduction broke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
        '404':
          description: No such decision

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  /change-requests:
    get:
      summary: The approval queue
      operationId: listChangeRequests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, withdrawn]
      responses:
        '200':
          description: Change requests, newest first
          content:
            application/json:
              schema:
                type: object
                required: [changeRequests, total]
                properties:
                  changeRequests:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeRequest'
                  total:
                    type: integer

    post:
      summary: Propose a change
      operationId: createChangeRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
      responses:
        '201':
          description: Created, pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'

  /change-requests/{requestId}:
    get:
      summary: A change request with its diff and simulation
      operationId: getChangeRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '404':
          description: No such change request

  /change-requests/{requestId}/approve:
    post:
      summary: Approve a change request, applying its diff
      operationId: approveChangeRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Approved. The diff is applied and the decision audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '403':
          description: Caller lacks approve:changes

  /change-requests/{requestId}/reject:
    post:
      summary: Reject a change request
      operationId: rejectChangeRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected, with the reason recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '403':
          description: Caller lacks approve:changes

  /audit:
    get:
      summary: The append-only log of every write
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events, total]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  total:
                    type: integer

  /connectors/{tenantId}:
    get:
      summary: Configured integrations
      operationId: listConnectors
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connector'

  /connectors/{tenantId}/{connectorId}:
    put:
      summary: Activate, deactivate or retune a connector
      operationId: updateConnector
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector'
      responses:
        '200':
          description: Updated, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '403':
          description: Caller lacks edit:integrations

  # ---------------------------------------------------------------------------
  # Strategies as the console reads them
  # ---------------------------------------------------------------------------
  /artifacts/{tenantId}:
    get:
      summary: List strategies with their compile status
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Strategies
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtifactSummary'

  /artifacts/{tenantId}/{artifactId}:
    get:
      summary: One strategy, with its graph and full compiler output
      operationId: getArtifactSummary
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strategy detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSummary'
        '404':
          description: No such strategy

  # ---------------------------------------------------------------------------
  # PROPOSED - registered in docs/gaps.md, not built.
  #
  # These are the platform contracts the console will need. Nothing serves them
  # yet, so the contract test skips them by design: it asserts that everything
  # NOT in this section is live, which is what stops the list from rotting.
  # ---------------------------------------------------------------------------
  /registry/{tenantId}/{strategyName}:
    post:
      summary: Publish a compiled artifact version
      operationId: publishArtifact
      x-metis-status: proposed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StrategyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompiledArtifact'
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompiledArtifact'
        '400':
          description: Artifact failed compilation

    get:
      summary: Fetch a compiled artifact
      operationId: getArtifact
      x-metis-status: proposed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StrategyName'
        - name: version
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The compiled artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompiledArtifact'
        '404':
          description: No such artifact

  /registry/{tenantId}/{strategyName}/versions:
    get:
      summary: List published versions
      operationId: listVersions
      x-metis-status: proposed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StrategyName'
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: string

  /registry/{tenantId}/{strategyName}/promote:
    post:
      summary: Promote a version between environments
      operationId: promoteVersion
      x-metis-status: proposed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StrategyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, to]
              properties:
                version:
                  type: string
                to:
                  type: string
      responses:
        '200':
          description: Promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompiledArtifact'

  /registry/{tenantId}/{strategyName}/rollback:
    post:
      summary: Roll back to the previous active version
      operationId: rollbackVersion
      x-metis-status: proposed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StrategyName'
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompiledArtifact'

  /registry/{tenantId}/{strategyName}/audit:
    get:
      summary: Publish and promotion history for one strategy
      operationId: getRegistryAuditLog
      x-metis-status: proposed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StrategyName'
      responses:
        '200':
          description: Registry audit entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object

  /simulations:
    post:
      summary: Run a population through a compiled strategy
      operationId: simulateStrategy
      x-metis-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifactId, populationSize]
              properties:
                artifactId:
                  type: string
                version:
                  type: string
                populationSize:
                  type: integer
      responses:
        '200':
          description: Aggregated outcomes, distribution and bias metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestSimulation'

  /counterfactuals:
    post:
      summary: Find the smallest input change that flips a decision
      operationId: getCounterfactual
      x-metis-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionId]
              properties:
                decisionId:
                  type: string
                targetWinner:
                  type: string
      responses:
        '200':
          description: The minimal diff, or none if the outcome cannot be flipped
          content:
            application/json:
              schema:
                type: object
                required: [found, changes]
                properties:
                  found:
                    type: boolean
                  changes:
                    type: array
                    items:
                      type: object
                      required: [field, from, to]
