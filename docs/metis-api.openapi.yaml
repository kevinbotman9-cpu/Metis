          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Outcomes, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [outcomes]
                properties:
                  outcomes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutcomeEvent'

  /audit:
