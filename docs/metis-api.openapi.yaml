  /data-sources/{tenantId}/{sourceId}/rows:
    post:
      summary: Land rows against a source
      description: |
        Records are held as they arrived, unmapped. Landing observes the column
        names and does not interpret them - the mapping is a separate,
        reviewable step, because a source is another system's schema and changes
        without asking.

        Landing resets the source to `draft`: rows that arrived after a
        validation were not the rows that were validated.
      operationId: landRows
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                replace:
                  type: boolean
                  description: Discard what was landed before rather than appending.
      responses:
        '200':
          description: Landed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSource' }
        '403':
          description: Requires edit:integrations

  /data-sources/{tenantId}/{sourceId}/validation:
    post:
      summary: Check the landed rows against the data model
      operationId: validateDataSource
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: The report, and the source with its new status
          content:
            application/json:
              schema:
                type: object
                required: [source, report]
                properties:
                  source: { $ref: '#/components/schemas/DataSource' }
                  report: { $ref: '#/components/schemas/ValidationReport' }

  /data-sources/{tenantId}/{sourceId}/activation:
    post:
      summary: Activate a validated source
      description: |
        Refused unless the most recent validation found no errors and every
        required field is filled. The point of landing and mapping first is to
        fail before anything reads the data.
      operationId: activateDataSource
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSource' }
        '409':
          description: The source cannot be activated yet
          content:
            application/json:
              schema:
                type: object
                required: [error, message, problems]
                properties:
                  error: { type: string }
                  message: { type: string }
                  problems:
                    type: array
                    items: { type: string }
        '403':
          description: Requires edit:integrations

