  # ---------------------------------------------------------------------------
  # Decisions and traces
  # ---------------------------------------------------------------------------
  /decisions/search:
    get:
      summary: Search decisions
      description: |
        GET rather than POST: the console keeps search state in the URL, so a
        filtered view has to be linkable and back-button-able.
      operationId: searchDecisions
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: outcome
          in: query
          schema:
            type: string
            enum: [offered, suppressed]
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching decisions, plus the unpaged total
          content:
            application/json:
              schema:
                type: object
                required: [decisions, total]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
                  total:
                    type: integer
                    description: Matches before the limit, not the page size

  /decisions:
    post:
      summary: Make a decision
      description: |
        Execute a flow against a request and return the trace.

        Integrations are resolved before the deterministic core runs and their
        values arrive in `request.input`. A service configured with a gateway
        resolves the connectors its flow names and merges the result; fields the
        caller supplied always win, so a request that carries every field is
        unaffected by whether resolution ran. A service configured without one
        fetches nothing and decides on what it was given.

        A connector configured `onFailure: fail` that fails is a 503: the flow
        and the request are both fine and a dependency is not.

        `occurredAt` is required and is never defaulted to the current time.
        Defaulting it would make a decision depend on when it was made, which
        is the one thing replay cannot tolerate.

        Two implementations serve this: the console's development store, and
        the JVM service in `engines/kotlin`. Both produce the same chain hash
        for the same input — see docs/conformance/service-cases.json.
      operationId: executeDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifactId, request]
              properties:
                artifactId:
                  type: string
                request:
                  type: object
                  required: [tenantId, customerId, channel, placement, occurredAt, input]
                  properties:
                    tenantId:
                      type: string
                    customerId:
                      type: string
                    channel:
                      type: string
                    placement:
                      type: string
                    occurredAt:
                      type: string
                      format: date-time
                      description: An input, never the clock.
                    input:
                      type: object
                      description: Customer and context attributes, already resolved.
                    contactHistory:
                      type: object
                    consent:
                      type: object
                    idempotencyKey:
                      type: string
                      description: >
                        Makes a retry safe. The same key with the same request
                        returns the original decision without re-executing; the
                        same key with a *different* request is a 409, because
                        the caller reused a token for a different question and
                        answering quietly would hand them a decision about
                        someone else's customer.

                        Excluded from the request hash — it identifies the
                        attempt, not the question. Scoped per tenant.
                      example: 4f9a1c22-8b1e-4f2a-9c31-1d0f7a6b5c2e
                    correlationId:
                      type: string
                      description: >
                        Tracing id, echoed back in the measured half of the
                        trace. Never hashed, and excluded from the request hash:
                        it differs on every retry, so including it would make
                        each retry a new request.
      responses:
        '200':
          description: >
            The decision and its trace. A response to a repeated idempotency
            key carries `Idempotent-Replay: true` and is the original decision,
            not a re-execution that happens to agree.
          content:
            application/json:
              schema:
                type: object
                required: [id, decision, chainHash]
                properties:
                  id:
                    type: string
                    description: Content-addressed. The first 16 characters of the chain hash.
                  decision:
                    type: object
                    description: The reproducible half, exactly as hashed.
                  chainHash:
                    type: string
        '400':
          description: Malformed request, or an artifact the engine cannot execute
        '409':
          description: >
            The idempotency key was already used for a different request.
            Deliberately not a 200 with the stored decision: that would answer a
            question the caller did not ask, and look successful doing it.
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error:
                    type: string
                    enum: [idempotency_conflict]
                  message:
                    type: string
        '404':
          description: No such artifact
        '503':
          description: >
            A connector the flow requires could not be read, and it is
            configured to fail rather than omit or default. No decision was
            made and none was recorded; the caller may retry.
          content:
            application/json:
              schema:
                type: object
                required: [error, message, connectorId, outcome]
                properties:
                  error:
                    type: string
                    enum: [integration_failed]
                  message:
                    type: string
                  connectorId:
                    type: string
                  outcome:
                    type: string
                    enum: [timeout, error]

  /decisions/{decisionId}/trace:
    get:
      summary: The full reasoning behind one decision
      operationId: getDecisionRecord
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '404':
          description: No such decision

  /decisions/{decisionId}/replay:
    post:
      summary: Re-execute a historical decision and compare it to the original
      operationId: replayDecision
      description: |
        Re-execute a decision against its recorded artifact and the catalogue,
        and compare the chain hashes.

        **The caller supplies the inputs.** A decision record holds
        `inputSnapshotHash` and not the values behind it, on purpose: a trace can
        then be kept for as long as an audit needs without keeping the customer
        data it was made from. So replaying a decision the platform did not seed
        means handing back the input it was made with, and the engine refuses
        anything that does not hash to the recorded snapshot — which is the
        check that will matter when the feature service lands and replay must
        read a snapshot rather than the live store.

        Seeded decisions carry their request alongside them, so they replay with
        no body. Everything else needs one, and says so rather than reporting a
        divergence that is really a missing argument.
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  description: The decision's original input, exactly as it was.
                contactHistory:
                  type: object
      responses:
        '200':
          description: |
            The replay outcome. `identical` is the claim the platform is making;
            when it is false, `diff` says exactly where reproduction broke — and
            a `$.inputSnapshotHash` difference means the inputs were wrong, not
            that the engine drifted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
        '404':
          description: No such decision
        '422':
          description: |
            The decision is recorded and its inputs are not, because the
            platform does not retain them. Supply `input` to replay it.
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error:
                    type: string
                    enum: [input_required]
                  message:
                    type: string

