  # ---------------------------------------------------------------------------
  # Placements — the slots a site asks about
  # ---------------------------------------------------------------------------
  /placements/{tenantId}:
    get:
      summary: Configured placements
      operationId: listPlacements
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Placements
          content:
            application/json:
              schema:
                type: object
                required: [placements]
                properties:
                  placements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Placement'

    post:
      summary: Configure a placement
      operationId: createPlacement
      description: |
        A slot the platform will decide for, and who delivers the result.

        Placements were fixture-authored until 2026-09-10: three of the five the
        seeded corpus decides for were not in the registry at all, and the
        `active` flag that governed the other two could only be changed by
        editing TypeScript and redeploying. Every decision ADR-013 describes —
        whether a slot is decidable, and whether anything sends what it produces
        — was configuration nobody could reach.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Placement'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placement'
        '400':
          description: A required field is missing, or the flow does not exist
        '403':
          description: Caller lacks edit:integrations
        '409':
          description: The key is already used by another placement

  /placements/{tenantId}/{placementKey}:
    put:
      summary: Update a placement
      operationId: updatePlacement
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: placementKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Placement'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placement'
        '400':
          description: The flow does not exist
        '403':
          description: Caller lacks edit:integrations
        '404':
          description: No such placement

  /deliveries/{tenantId}/{decisionId}:
    get:
      summary: What the platform did about delivering one decision
      operationId: listDeliveries
      description: |
        The delivery attempts bound to this decision, oldest first.

        Separate from `/outcomes` on purpose: an outcome is something the
        customer did and a delivery is something the platform did, and ADR-013
        §1 keeps them apart so the outcome funnel stays a funnel.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery attempts
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryAttempt'
        '404':
          description: No such decision

  /placements/{tenantId}/{placementKey}/decisions:
    post:
      summary: Decide what fills a placement
      operationId: decidePlacement
      x-metis-status: built
      description: |
        The same decision `executeDecision` makes, delivered as a slate.

        A decision names one winner. A placement has slots, and a page with six
        of them cannot be filled by six decisions that each say the same thing.
        So this returns the ranked candidates, as many as the placement's
        `slotCount` allows.

        **The slate is a projection of one decision, not several.** Every
        candidate that reached ranking is already in the record with its
        priority, and the ones that lost are recorded as `NOT_RANKED`. So this
        operation executes once, composes from the result, and returns the
        `decisionId` — the trace behind every slot is the same trace, and
        `entries[0]` is always that decision's own winner.

        Ordering by priority is the whole composition rule today. Cardinality,
        mutual exclusion and diversity are W-028, and when they land they will
        have to be part of the hashed decision, because a slate composed by a
        rule nobody recorded is not explainable.

        The caller names a placement, not a flow: which flow answers is
        configuration, not something a website should hold.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: placementKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  type: object
                  required: [tenantId, customerId, channel, occurredAt, input]
                  description: |
                    As `executeDecision`, minus `placement`, which the path
                    already names. Supplying a different one is a 400 rather
                    than a silent preference for one of them.
                  properties:
                    tenantId: { type: string }
                    customerId: { type: string }
                    channel: { type: string }
                    occurredAt:
                      type: string
                      format: date-time
                      description: An input, never the clock.
                    input:
                      type: object
                    contactHistory:
                      type: object
                    consent:
                      type: object
                    idempotencyKey:
                      type: string
                    correlationId:
                      type: string
      responses:
        '200':
          description: |
            The slate, and the decision it came from. `unfilled` is stated
            rather than padded: a placement asking for three where two
            candidates survived gets two and a count, because the honest answer
            to "we have nothing else" is not a third-best offer that failed a
            gate.
          content:
            application/json:
              schema:
                type: object
                required:
                  [placement, slotCount, decisionId, chainHash, entries,
                   unfilled, rankedCount]
                properties:
                  placement:
                    type: string
                  slotCount:
                    type: integer
                  decisionId:
                    type: string
                    description: One decision behind every slot. Its trace explains all of them.
                  chainHash:
                    type: string
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlateEntry'
                  unfilled:
                    type: integer
                    description: Slots no surviving candidate could fill.
                  rankedCount:
                    type: integer
                    description: |
                      How many candidates reached ranking, so a caller can say
                      "3 of 5 shown" rather than implying it saw everything.
        '400':
          description: Malformed request, or a `placement` in the body that contradicts the path
        '404':
          description: No such placement, or its flow is not loaded
        '409':
          description: The idempotency key was already used for a different request
        '503':
          description: A connector the flow requires could not be read

  /connectors/{tenantId}:
    get:
      summary: Configured integrations
      operationId: listConnectors
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connector'

  /connectors/{tenantId}/{connectorId}:
    put:
      summary: Activate, deactivate or retune a connector
      operationId: updateConnector
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector'
      responses:
        '200':
          description: Updated, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '403':
          description: Caller lacks edit:integrations

  # ---------------------------------------------------------------------------
  # Flows as the console reads them
  # ---------------------------------------------------------------------------
  /artifacts/{tenantId}:
    get:
      summary: List flows with their compile status
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Flows
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtifactSummary'

  /artifacts/{tenantId}/{artifactId}:
    get:
      summary: One flow, with its graph and full compiler output
      operationId: getArtifactSummary
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSummary'
        '404':
          description: No such flow

  /artifacts/{tenantId}/{artifactId}/draft:
    put:
      summary: Edit a flow's graph
      description: |
        Writes the authored source and compiles it, returning the report. The
        draft is saved even when it does not compile: a graph is built in steps
        and a half-connected one is a normal intermediate state, not an error to
        refuse. What refuses is publish, which is where a broken flow is meant
        to be stopped.

        Editing a flow does not change any decision. Decisions run the version
        promoted to an environment, so an edit reaches them through compile,
        publish and promote - which is the difference between a console and a
        deploy.
      operationId: updateDecisionFlowDraft
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodes:
                  type: array
                  items: { $ref: '#/components/schemas/FlowNode' }
                edges:
                  type: array
                  items: { $ref: '#/components/schemas/FlowEdge' }
                candidateKeys:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The saved draft and what the compiler said about it
          content:
            application/json:
              schema:
                type: object
                required: [artifact, compile]
                properties:
                  artifact: { $ref: '#/components/schemas/ArtifactSummary' }
                  compile: { $ref: '#/components/schemas/CompileResult' }
        '403':
          description: Requires edit:flows
        '404':
          description: No such flow

  # ---------------------------------------------------------------------------
  # PROPOSED - registered in docs/gaps.md, not built.
  #
  # These are the platform contracts the console will need. Nothing serves them
  # yet, so the contract test skips them by design: it asserts that everything
  # NOT in this section is live, which is what stops the list from rotting.
  # ---------------------------------------------------------------------------
  /registry/{tenantId}:
    get:
      summary: Flows in the registry
      operationId: listRegistryFlows
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Registered flow names
          content:
            application/json:
              schema:
                type: object
                required: [flows]
                properties:
                  flows:
                    type: array
                    items:
                      type: string

  /registry/{tenantId}/{flowName}:
    get:
      summary: Published versions and where each is running
      operationId: getRegistryEntry
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      responses:
        '200':
          description: Versions and environment state
          content:
            application/json:
              schema:
                type: object
                required: [flowName, versions, environments]
                properties:
                  flowName:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedVersion'
                  environments:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvironmentState'
        '404':
          description: No such flow in the registry

    post:
      summary: Publish a version
      description: |
        Compiles first. A flow with compilation errors is refused and
        nothing is stored, so it cannot be promoted and cannot reach execution.
        The refusal is recorded: an audit that only shows what succeeded cannot
        answer whether anyone tried to ship something.

        Publishing does not activate. A published version sits in the registry
        until it is promoted to an environment.

        Republishing byte-identical content under the same version is a no-op
        and returns `unchanged`. Different content under a published version is
        refused: a version is bound to an artifact hash.
      operationId: publishArtifact
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, source]
              properties:
                version:
                  type: string
                source:
                  type: object
                  description: The flow as authored, before compilation.
      responses:
        '201':
          description: Published, or unchanged if the content was already there
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishOutcome'
        '409':
          description: Refused - compilation errors, or the version holds different content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishOutcome'
        '403':
          description: Caller lacks publish:flows

  /registry/{tenantId}/{flowName}/promote:
    post:
      summary: Point an environment at a published version
      operationId: promoteVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, environment]
              properties:
                version:
                  type: string
                environment:
                  type: string
      responses:
        '200':
          description: Promoted, and written to the registry log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '404':
          description: That version was never published
        '409':
          description: That version is already active in this environment
        '403':
          description: Caller lacks promote:flows

  /registry/{tenantId}/{flowName}/shadow:
    post:
      summary: Start or stop a shadow
      description: |
        Runs a published version beside the active one, deciding nothing.

        A null `version` stops the shadow. One verb rather than two, because
        "what is shadowing" is one piece of state.

        Refused if the version is already active: comparing a thing with itself
        produces a 100% agreement rate that means nothing, and publishing that
        number would be worse than having none. Also refused where nothing is
        active, since there is no baseline to compare against.

        Gated on `promote:flows` rather than a permission of its own. Deciding
        what runs in production, even beside the active version, is the same
        authority.
      operationId: setShadow
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                version:
                  type: [string, 'null']
                  description: Null stops the shadow.
                environment:
                  type: string
      responses:
        '200':
          description: The environment, with its shadow set or cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '403':
          description: Caller lacks promote:flows
        '404':
          description: No such version
        '409':
          description: >
            Already active, or nothing running to compare against, or no shadow
            to stop.

  /registry/{tenantId}/{flowName}/shadow-report:
    get:
      summary: How the shadow compares to what is running
      description: |
        Agreement rate and the most common divergences, for the pair currently
        configured. Comparisons from an earlier shadow are excluded: they
        describe a different question, and folding them in would average across
        two migrations.

        Three separate comparisons, not one boolean — a migration that changes
        *why* without changing *what* is exactly the case a regulator asks
        about, and agreement on the winner alone would hide it:

        - `winner` — did it choose the same action?
        - `ranking` — did it order the candidates the same way?
        - `reasons` — did it deny the same candidates for the same coded reason?

        Zero comparisons reports a 0% agreement rate, not 100%. Nothing has
        agreed yet.

        `shadowMsP50` and `shadowMsP95` are what the shadow cost. It runs after
        the response is sent and never enters the active latency budget, so
        these are published rather than hidden — a cost that is real but paid
        somewhere the caller does not wait for it.
      operationId: getShadowReport
      x-metis-status: built
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowReport'
        '404':
          description: >
            No such flow in the registry. A flow that failed to compile was
            never stored, and a zeroed report about it would read as a shadow
            that is merely idle rather than one that cannot exist.

  /registry/{tenantId}/{flowName}/rollback:
    post:
      summary: Return an environment to the version it ran before
      description: |
        The rollback becomes the new active version and the version it replaced
        becomes the rollback target, so rolling back twice returns to where you
        started rather than walking backwards through history.
      operationId: rollbackVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FlowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment:
                  type: string
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '409':
          description: Nothing to roll back to
        '403':
          description: Caller lacks promote:flows

  /registry/{tenantId}/events:
    get:
      summary: The registry's append-only log
      description: |
        Publishes, promotions, rollbacks and refusals, newest first. Ordered by
        sequence rather than timestamp: two events can share a timestamp, and
        the sequence is what makes the order a fact.
      operationId: listRegistryEvents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: flowName
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistryEvent'

  /simulations:
    post:
      summary: Run a population through a compiled flow
      operationId: simulateDecisionFlow
      x-metis-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifactId, populationSize]
              properties:
                artifactId:
                  type: string
                version:
                  type: string
                populationSize:
                  type: integer
      responses:
        '200':
          description: Aggregated outcomes, distribution and bias metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSetSimulation'

  /counterfactuals:
    post:
      summary: Find the smallest input change that flips a decision
      operationId: getCounterfactual
      x-metis-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionId]
              properties:
                decisionId:
                  type: string
                targetWinner:
                  type: string
      responses:
        '200':
          description: The minimal diff, or none if the outcome cannot be flipped
          content:
            application/json:
              schema:
                type: object
                required: [found, changes]
                properties:
                  found:
                    type: boolean
                  changes:
                    type: array
                    items:
                      type: object
                      required: [field, from, to]
                      properties:
                        field:
                          type: string
                        from: {}
                        to: {}

  /inbound-calls:
    get:
      summary: The HTTP traffic this API has served
      description: |
        Request and response envelopes for recent calls, newest first — what a
        caller sent and what came back, in full.

        This exists because the decision ledger cannot answer it. A
        `DecisionRecord` stores `inputSnapshotHash` and never the input values,
        so "what did that site actually post" is deliberately unanswerable from
        the audit trail. Integrators still need to know, so it is answered at
        the edge, from a bounded in-memory buffer that is lost on restart, and
        never from durable storage.

        Proposed rather than built: the console's development API serves this
        over its own fixture store. The execution plane does not, and the
        production shape of this question is an OpenTelemetry span (W-048), not
        a retained request body. See docs/gaps.md.
      operationId: listInboundCalls
      x-metis-status: proposed
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent calls, newest first
          content:
            application/json:
              schema:
                type: object
                required: [enabled, calls]
                properties:
                  enabled:
                    type: boolean
                    description: False when recording is switched off; `calls` is then empty rather than stale.
                  calls:
                    type: array
                    items:
                      $ref: '#/components/schemas/InboundCall'

  /inbound-calls/clear:
    post:
      summary: Empty the traffic buffer
      description: |
        Discards every recorded call. Used before a demonstration so the rows
        that follow are the ones the run produced.
      operationId: clearInboundCalls
      x-metis-status: proposed
      responses:
        '200':
          description: Buffer emptied
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared:
                    type: boolean
