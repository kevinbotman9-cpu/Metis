openapi: 3.1.0
info:
  title: METIS Execution Plane API
  version: 2.0.0
  description: |
    AI-native decision platform API.
    Execution plane: deterministic flow execution, artifact registry, approval workflow.
  contact:
    name: METIS Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://metis.example.com/api
    description: Production

components:
  schemas:
    CompiledDecisionFlow:
      type: object
      description: |
        What the compiler emits. Distinct from ArtifactSummary, which is how the
        console renders a flow: this is the immutable, executable form the
        registry stores and the engine runs.
      required:
        [id, version, tenantId, nodes, edges, candidateKeys, packageVersions,
         costManifest, artifactHash, compiledAt]
      properties:
        id:
          type: string
        version:
          type: string
        tenantId:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/CompiledNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/CompiledEdge'
        candidateKeys:
          type: array
          items:
            type: string
        packageVersions:
          type: object
          description: Exact versions, locked at compile time so a replay is reproducible.
          additionalProperties:
            type: string
        policySources:
          type: object
          description: |
            Which pack supplied each targeting policy this flow references,
            keyed by policy id. packageVersions pins the packs a decision
            compiled against; this says which of them a given rule came from,
            so a refusal can be attributed to a pack rather than to a bare
            policy id. Policies no pack claims are absent: a tenant authoring
            its own rule is the answer, not a hole in the record.
          additionalProperties:
            $ref: '#/components/schemas/PolicySource'
        costManifest:
          $ref: '#/components/schemas/CostManifest'
        artifactHash:
          type: string
          description: |
            sha256 over everything above. Excludes compiledAt, so two
            compilations of the same source produce the same hash - which is
            what lets the registry treat a republish as a no-op.
        compiledAt:
          type: string
          format: date-time
          description: Metadata, not part of the hash.

    CompiledNode:
      type: object
      description: |
        A node as compiled: what the author wrote, plus what compilation
        worked out.
      required: [id, type, label]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [source, filter, constraint, score-model, score-adaptive, switch,
                 explain-annotate, arbitrate]
        label:
          type: string
        policyIds:
          type: array
          items:
            type: string
        frequencyPolicyIds:
          type: array
          items:
            type: string
        connectorIds:
          type: array
          items:
            type: string
        model:
          type: object
          required: [id, version]
          properties:
            id:
              type: string
            version:
              type: string
        estimatedMs:
          type: number
        tier:
          type: string
          enum: [eligibility, relevance, suitability, frequency]
          description: |
            Which question the node answers, derived at compile time from the
            kinds of the targeting policies it declares. type says how a node
            behaves - an affordability tier and a weekly contact cap are both
            constraint - so without this a reader has to infer the tier from
            the node id.

            It names the node's declared policies, not everything it enforces:
            the engine applies frequency caps and consent at every constraint
            node, so a CONSENT_WITHHELD denial can be recorded against a node
            whose tier is suitability. A denial's reason code says why a
            candidate went; this says what the node was built to ask. Absent
            when a node's policies span more than one tier.

    CompiledEdge:
      type: object
      description: An edge in a compiled flow. Distinct from FlowEdge, which is the canvas shape.
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string

    PolicySource:
      type: object
      description: Which pack supplied a rule, as pinned in a compiled artifact.
      required: [packId, name, version]
      properties:
        packId:
          type: string
        name:
          type: string
        version:
          type: string

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Minor units, e.g. pence. 3500 = 35.00
        currency:
          type: string
          enum: [GBP, USD, EUR]

    Objective:
      type: object
      required:
        - id
        - name
        - key
        - description
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        key:
          type: string
          description: URL-safe stable key, e.g. "retention"
        description: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Category:
      type: object
      required:
        - id
        - objectiveId
        - name
        - key
        - description
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        objectiveId: { type: string }
        name: { type: string }
        key: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ValidityWindow:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt: { type: string, format: date }
        endsAt:
          type: [string, "null"]
          format: date
          description: null means open-ended

    OfferFinancials:
      type: object
      required:
        - price
        - cost
        - expectedMargin
        - termMonths
        - oneOff
      properties:
        price: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        expectedMargin: { $ref: "#/components/schemas/Money" }
        termMonths: { type: integer }
        oneOff: { type: boolean }

    Offer:
      type: object
      required:
        - id
        - categoryId
        - objectiveId
        - name
        - key
        - description
        - status
        - financials
        - validity
        - boost
        - policyIds
        - creativeIds
        - tags
        - createdAt
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        categoryId: { type: string }
        objectiveId:
          type: string
          description: Denormalised from the category for tree and breadcrumb rendering
        name: { type: string }
        key: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [draft, active, paused, retired]
        financials: { $ref: "#/components/schemas/OfferFinancials" }
        validity: { $ref: "#/components/schemas/ValidityWindow" }
        boost:
          type: number
          description: Business priority multiplier. 1.0 is neutral.
        contractUrl:
          type: string
          description: >-
            Link to the contractual terms the customer is agreeing to. Optional,
            because not every offer has separate terms; where one does, the
            trace should be able to reach what was actually promised.
        policyIds:
          type: array
          items: { type: string }
        creativeIds:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    Creative:
      type: object
      required:
        - id
        - offerId
        - name
        - channel
        - content
        - active
        - locale
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        offerId: { type: string }
        name: { type: string }
        channel:
          type: string
          enum: [email, sms, web, push, outbound_call]
        content:
          type: object
          description: |
            Channel-specific content; shape is discriminated by channel.

            On `web`, two separate fields describe where it goes and how it
            looks. `placement` is a slot key, joining to a configured
            `Placement`; empty means the creative can fill any slot on the
            channel. `placementType` is the shape — one of carousel,
            feature_band, footer_bar, hero, page_takeover, tile.

            Separate because they are separate decisions, usually made by
            different people: a slot and a design. A slot declares its own
            `type`, so a creative can inherit one and the two can be compared
            rather than assumed to agree.
          additionalProperties: true
        active: { type: boolean }
        locale: { type: string, example: en-GB }
        reviewNote:
          type: string
          description: >-
            Why this content reads the way it does — a claim substantiation, a
            legal sign-off reference, a note about wording somebody argued over.
            Optional, and carried into the trace so a regulator asking "why did
            it say that" reaches the reasoning rather than only the text.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Targeting and frequency policy
    # -------------------------------------------------------------------------

    PolicyScope:
      type: object
      required:
        - level
        - targetId
      properties:
        level:
          type: string
          enum: [tenant, objective, category, offer]
        targetId:
          type: [string, "null"]
          description: null when level is tenant

    PolicyCondition:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: Dotted path into the customer data model
          example: customer.age
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte, in, not_in, contains, exists, not_exists]
        value: {}

    SchemaField:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
          description: The path segment, e.g. `age` in `customer.age`.
        type:
          type: string
          enum: [string, integer, decimal, boolean, timestamp, enum, money]
          description: >-
            integer and decimal are separate because the difference is a real
            authoring constraint, and because the value control differs.
        description: { type: string }
        members:
          type: array
          items: { type: string }
          description: Allowed values, for `enum`. The editor renders these and the compiler checks them.
        required: { type: boolean }
        sensitivity:
          type: string
          enum: [none, personal, special_category]
          description: >-
            Retention's input, not decoration. Classifying at declaration time
            is far cheaper than classifying a populated store later.
        unit:
          type: string
          description: days, pence, ratio, months. Shown beside the value input.

    SchemaRelationship:
      type: object
      required: [name, entity, cardinality, description]
      properties:
        name: { type: string }
        entity: { type: string, description: Target entity name. }
        cardinality:
          type: string
          enum: [one, many]
        description: { type: string }

    SchemaEntity:
      type: object
      required: [name, description, fields]
      properties:
        name: { type: string }
        description: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/SchemaField' }
        relationships:
          type: array
          items: { $ref: '#/components/schemas/SchemaRelationship' }

    SchemaAggregation:
      type: object
      description: >-
        A rollup over a `many` relationship, resolved before the deterministic
        core and entering the hashed input as a scalar. Declared on the schema
        rather than written inside a policy, so it is a named reviewable object
        and the cost of a decision stays predictable.
      required: [produces, description, over, fn, type]
      properties:
        produces:
          type: string
          description: The flat path it produces in the input, e.g. `accounts.worst_arrears_days`.
        description: { type: string }
        over:
          type: array
          items: { type: string }
          description: Relationship names from the root entity.
        fn:
          type: string
          enum: [count, sum, min, max, any, all]
        field:
          type: string
          description: Field on the target entity. Omitted for `count`, required otherwise.
        where:
          type: array
          items: { $ref: '#/components/schemas/PolicyCondition' }
        type:
          type: string
          enum: [string, integer, decimal, boolean, timestamp, enum, money]

    Transform:
      type: object
      description: >-
        A declared transform. The set is closed on purpose: an arbitrary
        expression in a mapping is code running over customer data on an ingest
        path, versioned nowhere and reviewed by nobody.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, trim, lowercase, uppercase, to_number, to_boolean, map_values, years_since]
        values:
          type: object
          additionalProperties: { type: string }
          description: >-
            For map_values. Exhaustive - a source value with no entry is a
            problem rather than a pass-through.

    FieldMapping:
      type: object
      required: [column, path]
      properties:
        column: { type: string, description: Column name in the landed rows. }
        path: { type: string, description: Dotted path in the data model. }
        transform: { $ref: '#/components/schemas/Transform' }

    ColumnSummary:
      type: object
      required: [column, path, filled, failed, examples]
      properties:
        column: { type: string }
        path: { type: string }
        filled: { type: integer }
        failed: { type: integer }
        examples:
          type: array
          items: { type: string }

    ValidationReport:
      type: object
      description: >-
        Summarised by column rather than by row. An import fails for a handful
        of reasons repeated thousands of times, and the question is which column
        is wrong and what the bad value looks like.
      required: [rows, clean, columns, missingRequired, unmapped, errors]
      properties:
        rows: { type: integer }
        clean: { type: integer, description: Rows with no problem in any column. }
        columns:
          type: array
          items: { $ref: '#/components/schemas/ColumnSummary' }
        missingRequired:
          type: array
          items: { type: string }
        unmapped:
          type: array
          items: { type: string }
        errors: { type: integer }

    DataSource:
      type: object
      description: >-
        A source of customer records, and the mapping from its shape onto the
        data model. Land, map, validate, activate - a source that has not
        validated cleanly cannot be activated.
      required: [id, tenantId, name, description, kind, columns, mappings, status, landedRows, updatedAt, updatedBy]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [file, http, inline]
        columns:
          type: array
          items: { type: string }
          description: Column names observed when rows were landed.
        mappings:
          type: array
          items: { $ref: '#/components/schemas/FieldMapping' }
        status:
          type: string
          enum: [draft, validated, active]
        landedRows: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    ExperimentArm:
      type: object
      required: [key, name, weight]
      properties:
        key:
          type: string
          description: Stable identifier. Appears in policies and reports, so it must not change.
        name: { type: string }
        weight:
          type: number
          description: Relative share. Not required to sum to 100 - weights are normalised.
        holdout:
          type: boolean
          description: >-
            The untreated group. Marked rather than inferred from the name -
            control, holdout and baseline all appear in the wild.

    Experiment:
      type: object
      description: >-
        An arm assignment is an input to a decision, not a wrapper around one.
        It is a pure function of the customer reference, so an arm is recomputed
        from a decision record months later rather than stored - which is why a
        running experiment's arms are frozen.
      required: [id, tenantId, key, name, description, arms, status, startedAt, stoppedAt, updatedAt, updatedBy]
      properties:
        id: { type: string }
        tenantId: { type: string }
        key:
          type: string
          description: The arm reaches policies at `experiments.<key>`.
        name: { type: string }
        description: { type: string }
        arms:
          type: array
          items: { $ref: '#/components/schemas/ExperimentArm' }
        status:
          type: string
          enum: [draft, running, stopped]
        startedAt: { type: string, nullable: true, format: date-time }
        stoppedAt: { type: string, nullable: true, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    ArmPerformance:
      type: object
      required: [experimentKey, arm, holdout, offered, measured, acceptances, acceptanceRate, valueMinor]
      properties:
        experimentKey: { type: string }
        arm: { type: string }
        holdout: { type: boolean }
        offered: { type: integer }
        measured: { type: integer }
        acceptances: { type: integer }
        acceptanceRate:
          type: number
          nullable: true
          description: Null when nothing was measured. Zero would claim the arm was seen and refused.
        valueMinor: { type: integer, nullable: true }

    PerformanceRow:
      type: object
      required: [action, channel, flowId, offered, measured, impressions, clicks, acceptances, rejections, conversions, valueMinor, acceptanceRate, clickRate]
      properties:
        action: { type: string }
        channel: { type: string }
        flowId: { type: string }
        offered:
          type: integer
          description: Decisions where this action won.
        measured:
          type: integer
          description: >-
            Decisions with any outcome recorded. The denominator for every rate
            here - a rate over `offered` would divide by decisions nobody
            reported on, turning silence into 0%.
        impressions: { type: integer }
        clicks: { type: integer }
        acceptances: { type: integer }
        rejections: { type: integer }
        conversions: { type: integer }
        valueMinor:
          type: integer
          nullable: true
          description: >-
            Null when no outcome carried a value, which is distinct from zero -
            zero would claim the offers were worth nothing rather than that
            nobody said.
        acceptanceRate:
          type: number
          nullable: true
          description: >-
            Null when nothing was measured. Zero would claim the offer was seen
            and refused; null says nobody reported back.
        clickRate:
          type: number
          nullable: true

    Provenance:
      type: object
      description: |
        Where the numbers in this response came from.

        The seeded `demo-telco-uk` tenant became indistinguishable from real
        reporting on 2026-09-09: 10,400 decisions, 2,101 measured outcomes,
        plausible click rates and realised value in pounds, all derived from
        `seededUnitInterval` and none of it from a customer. The only marker was
        a badge in a corner of the console's nav rail, which no API response
        carried and no screenshot was obliged to include.

        So a response whose numbers are synthetic says so, in the payload. A
        marker that lives only in the interface is a marker that does not
        survive an export, a screenshot, or a `curl`.
      required: [source, note]
      properties:
        source:
          type: string
          enum: [synthetic, recorded, mixed]
          description: >-
            `synthetic` when every figure derives from the seed, `recorded` when
            every figure derives from something that actually happened, `mixed`
            when a report joins both - which is the normal state of a demo
            tenant somebody has clicked in.
        syntheticCount:
          type: integer
          description: Rows or records in this response that derive from the seed.
        recordedCount:
          type: integer
          description: Rows or records that derive from real traffic.
        note:
          type: string
          description: >-
            A sentence a person can read in an exported file months later,
            without this document in front of them.
    PerformanceReport:
      type: object
      required:
        [rows, decisions, offered, suppressed, measured, deliverable, acted,
         channels, series]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/PerformanceRow' }
        decisions: { type: integer }
        offered: { type: integer }
        suppressed:
          type: integer
          description: >-
            Decisions that offered nothing. Reported beside the rest rather than
            hidden - on a platform whose suitability tier exists to refuse
            profitable offers, suppression is a result, not a shortfall.
        measured:
          type: integer
          description: Decisions with at least one outcome recorded against them.
        deliverable:
          type: [integer, 'null']
          description: |
            Offered decisions on a channel something actually delivers.

            The stage the loop breaks at: a decision can be correct, recorded
            and replayable and still reach nobody, because the channel that won
            it has no sender. ADR-013.

            Null when the caller did not say which channels deliver — absent
            rather than zero, because "nothing is deliverable" and "nobody told
            us" are different answers and a screen must not render the second as
            the first.
        acted:
          type: integer
          description: >-
            Decisions with a click, acceptance or conversion. The customer did
            something.
        channels:
          type: array
          items: { $ref: '#/components/schemas/ChannelStages' }
          description: >-
            The same five stages per channel, so a rate below the break can name
            the population it describes.
        series:
          type: array
          items: { $ref: '#/components/schemas/LoopDay' }
          description: Daily, oldest first. What the rail's sparklines are drawn from.
        from: { type: string, nullable: true, format: date-time }
        to: { type: string, nullable: true, format: date-time }
        provenance:
          $ref: '#/components/schemas/Provenance' 
        arms:
          type: array
          items: { $ref: '#/components/schemas/ArmPerformance' }
          description: >-
            Per-arm counts for every running or stopped experiment, recomputed
            from each decision's customer reference rather than read from a
            stored assignment.

    ChannelStages:
      type: object
      description: |
        One channel's path through the loop.

        Every field is a subset of the one before it. That nesting is the
        property the Cascade pattern rests on — `METIS_CONSOLE_SPEC.md` §4.7 —
        and a figure that exceeds the one above it means the two are counting
        different populations.
      required: [channel, delivers, decisions, offered, deliverable, seen, acted]
      properties:
        channel:
          type: string
          enum: [email, sms, web, push, outbound_call]
        delivers:
          type: boolean
          description: Whether anything carries a decision on this channel to a customer.
        decisions: { type: integer }
        offered: { type: integer }
        deliverable: { type: integer }
        seen: { type: integer }
        acted: { type: integer }

    LoopDay:
      type: object
      description: One day of the loop, for the rail's sparklines.
      required: [date, decisions, offered, deliverable, seen, acted]
      properties:
        date:
          type: string
          description: '`YYYY-MM-DD`, from the decision''s own timestamp rather than a clock.'
        decisions: { type: integer }
        offered: { type: integer }
        deliverable: { type: integer }
        seen: { type: integer }
        acted: { type: integer }

    ProfileSchema:
      type: object
      description: >-
        The tenant's customer data model. A contract about what fields exist and
        how entities relate; it says nothing about where values come from, which
        is already two separate answers (the caller sends them, or a connector
        resolves them).
      required: [id, tenantId, version, root, entities, aggregations, updatedAt, updatedBy]
      properties:
        id: { type: string }
        tenantId: { type: string }
        version:
          type: string
          description: Bumped whenever the shape changes.
        root:
          type: string
          description: The entity the decision input *is*.
        entities:
          type: array
          items: { $ref: '#/components/schemas/SchemaEntity' }
        aggregations:
          type: array
          items: { $ref: '#/components/schemas/SchemaAggregation' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    SchemaFieldPath:
      type: object
      description: One selectable path, as the policy editor's field picker lists them.
      required: [path, type, kind, description, operators]
      properties:
        path: { type: string }
        type:
          type: string
          enum: [string, integer, decimal, boolean, timestamp, enum, money]
        kind:
          type: string
          enum: [field, aggregation]
        description: { type: string }
        entity: { type: string }
        members:
          type: array
          items: { type: string }
        unit: { type: string }
        sensitivity:
          type: string
          enum: [none, personal, special_category]
        operators:
          type: array
          items: { type: string }
          description: >-
            The operators this type admits. Served rather than derived in the
            client so the editor and the compiler cannot offer different sets.

    TargetingPolicyWrite:
      type: object
      required: [name, kind, description, conditions, scope, active]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [eligibility, relevance, suitability]
        description: { type: string }
        conditions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PolicyCondition' }
        scope: { $ref: '#/components/schemas/PolicyScope' }
        active: { type: boolean }

    PolicyRejected:
      type: object
      description: >-
        Per-condition reasons, so a form can put each one against the control
        that produced it. A validation error rendered as one sentence at the top
        of a dialog makes the person hunt for the field.
      required: [error, message, problems]
      properties:
        error: { type: string }
        message: { type: string }
        problems:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Dotted path into the submitted object, e.g. `conditions.0.value`.
              message: { type: string }
              code: { type: string }

    TargetingPolicy:
      type: object
      required:
        - id
        - name
        - kind
        - description
        - conditions
        - scope
        - active
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [eligibility, relevance, suitability]
          description: >-
            eligibility = can we offer it; relevance = should we now;
            suitability = is it right for this customer
        description: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/PolicyCondition" }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FrequencyPolicy:
      type: object
      required:
        - id
        - name
        - description
        - channel
        - maxContacts
        - period
        - cooldownDaysAfterReject
        - scope
        - active
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        channel:
          type: [string, "null"]
          enum: [email, sms, web, push, outbound_call, null]
          description: null applies to every channel
        maxContacts: { type: integer }
        period:
          type: string
          enum: [day, week, month]
        cooldownDaysAfterReject: { type: integer }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        active: { type: boolean }

    # -------------------------------------------------------------------------
    # Arbitration
    # -------------------------------------------------------------------------

    ArbitrationConfig:
      type: object
      required:
        - id
        - tenantId
        - weights
        - utility
        - formula
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        tenantId: { type: string }
        utility:
          type: object
          description: >
            Which ranking function computes priority. Required, with no
            default: a missing reference used to mean "whatever the engine
            hard-codes", which is the coupling this replaces. Publishing is
            gated on the function existing (UNKNOWN_UTILITY_FUNCTION) and on it
            reading only terms the engine produces (UTILITY_TERM_UNAVAILABLE).
          required: [id, version]
          properties:
            id:
              type: string
              example: multiplicative
            version:
              type: string
              description: >
                Semver. Arithmetic changes are a new version, never an edit —
                decisions already point at the old one.
              example: 1.0.0
        weights:
          type: object
          description: >
            Exponent weights for the multiplicative function. A function that
            reads no weights (expected-value) ignores these entirely.
          required:
            - propensity
            - value
            - boost
            - context
          properties:
            propensity: { type: number }
            value: { type: number }
            boost: { type: number }
            context: { type: number }
        formula: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    Boost:
      type: object
      required:
        - id
        - name
        - scope
        - value
        - reason
        - validity
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        name: { type: string }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        value:
          type: number
          description: Multiplier. 1.0 is neutral.
        reason: { type: string }
        validity:
          oneOf:
            - { $ref: "#/components/schemas/ValidityWindow" }
            - { type: "null" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    # -------------------------------------------------------------------------
    # Agentic AI autonomy
    # -------------------------------------------------------------------------

    AutonomyGuardrails:
      type: object
      required:
        - maxBlastRadiusPct
        - allowedChangeTypes
        - maxBoostDelta
        - maxBudgetDelta
        - protectedAttributes
        - requireSimulationPass
        - biasGateThreshold
      properties:
        maxBlastRadiusPct:
          type: number
          minimum: 0
          maximum: 100
        allowedChangeTypes:
          type: array
          items:
            type: string
            enum:
              - boost_adjust
              - creative_copy
              - policy_edit
              - offer_create
              - offer_retire
              - flow_edit
              - arbitration_weights
        maxBoostDelta:
          type: number
          description: Fraction. 0.1 permits +/-10%.
        maxBudgetDelta: { $ref: "#/components/schemas/Money" }
        protectedAttributes:
          type: array
          items: { type: string }
        requireSimulationPass: { type: boolean }
        biasGateThreshold: { type: number }

    AutonomySetting:
      type: object
      required:
        - id
        - scope
        - level
        - guardrails
        - rationale
        - updatedAt
        - updatedBy
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        level:
          type: string
          enum: [L0, L1, L2, L3, L4]
          description: >-
            L0 Observe, L1 Assist, L2 Propose, L3 Bounded, L4 Autonomous.
            Resolved most-specific-first: offer > category > objective > tenant.
        guardrails: { $ref: "#/components/schemas/AutonomyGuardrails" }
        rationale:
          type: string
          description: Why this scope was granted this level. Required for audit.
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    AgentActivity:
      type: object
      required:
        - id
        - timestamp
        - agentId
        - level
        - scope
        - changeType
        - summary
        - outcome
        - guardrailBreached
        - changeSetId
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        agentId: { type: string }
        level:
          type: string
          enum: [L0, L1, L2, L3, L4]
        scope: { $ref: "#/components/schemas/PolicyScope" }
        changeType:
          type: string
          enum:
            - boost_adjust
            - creative_copy
            - policy_edit
            - offer_create
            - offer_retire
            - flow_edit
            - arbitration_weights
        summary: { type: string }
        outcome:
          type: string
          enum: [suggested, proposed, auto_applied, reverted, blocked]
        guardrailBreached:
          type: [string, "null"]
        changeSetId:
          type: [string, "null"]

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------

    AuthUser:
      type: object
      required:
        - id
        - email
        - name
        - roles
        - permissions
        - tenantId
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [architect, marketer, compliance, analyst, operator, admin]
        permissions:
          type: array
          description: >
            What this account may do. Left as free strings rather than an enum
            because a tenant may carry permissions from an installed pack, but
            the set the console itself gates on is closed and listed here.


            Reads: `view:offers`, `view:flows`, `view:decisions`, `view:audit`,
            `view:policies`, `view:integrations`, `view:autonomy`. Writes:
            `edit:offers`, `edit:flows`, `edit:policies`, `edit:arbitration`,
            `edit:integrations`, `edit:autonomy`, `publish:flows`,
            `promote:flows`, `request:changes`, `approve:changes`,
            `admin:settings`.


            `view:integrations` and `view:autonomy` were added on 2026-09-10.
            The four screens they gate had no read permission and the only
            candidates were `edit:integrations` and `edit:autonomy`; gating a
            read behind a write means nobody may look who may not change, which
            is backwards on a product built around a compliance officer who
            changes nothing.


            A route is gated by declaring the permission on its entry in the
            console's navigation manifest. `RequireAuth` reads the same
            declaration, so the rail and the route cannot disagree.
          items: { type: string }
        tenantId: { type: string }
    Denial:
      type: object
      description: >
        Why one candidate was removed. Stable, parseable and translatable,
        which the node's prose `reason` is not — this is what answers "why was
        this action not offered to me" for a single action.
      required: [key, code, ruleId]
      properties:
        key:
          type: string
          description: The candidate this is about.
        code:
          type: string
          description: >
            A closed set, never renamed. NOT_RANKED is not a fault: the
            candidate passed every gate and was beaten.
          enum:
            - ELIGIBILITY_FAILED
            - RELEVANCE_FAILED
            - SUITABILITY_FAILED
            - FREQUENCY_CAP_BREACHED
            - CONSENT_WITHHELD
            - OUT_OF_VALIDITY_WINDOW
            - NOT_ACTIVE
            - NOT_RANKED
        ruleId:
          type: [string, "null"]
          description: >
            The targeting or frequency policy that did it, where one is
            identifiable. Null for codes that are properties of the candidate
            rather than of a rule. Always present, never omitted — an optional
            key would mean two engines each deciding when to drop it, and the
            canonical form differs if they disagree.

    Elimination:
      type: object
      description: One node's verdict on the candidate set, in execution order.
      required: [nodeId, nodeType, reason, denials, survived]
      properties:
        nodeId:
          type: string
        nodeType:
          type: string
        reason:
          type: string
          description: Human sentence for the trace view. Not stable; do not parse it.
        denials:
          type: array
          description: >
            One entry per candidate removed here, sorted by key. Sorted rather
            than left in evaluation order because within a node the removals
            are simultaneous, so order carries no information and would only be
            a way for two engines to disagree.
          items:
            $ref: '#/components/schemas/Denial'
        survived:
          type: array
          items:
            type: string

    ScoreBreakdown:
      type: object
      description: >
        Every term the engine produces for a candidate, and the priority the
        ranking function computed from them. All terms are present whichever
        function ran: a term appearing only when some function asks for it
        would make the decision shape depend on the ranking config, and two
        decisions from one tenant would hash over different structures.
      required: [propensity, value, boost, context, cost, priority]
      properties:
        propensity:
          type: number
        value:
          type: number
        boost:
          type: number
        context:
          type: number
        cost:
          type: number
          description: Delivery cost, normalised on the same scale as value.
        priority:
          type: number

    OutcomeEvent:
      type: object
      description: >
        Something that happened to a decision afterwards. Storage only —
        nothing learns from these yet, and a table that quietly fed a model
        would be the opposite of the point.
      required: [decisionId, type, occurredAt, valueMinor]
      properties:
        decisionId:
          type: string
        type:
          type: string
          enum: [impression, click, acceptance, rejection, conversion]
        occurredAt:
          type: string
          format: date-time
        valueMinor:
          type: [integer, 'null']
          description: >
            Realised value in minor units, where the outcome carries one. Null
            rather than zero when there is none: a click is not a conversion
            worth nothing, and averaging over zeros would say it was.
        detail:
          type: object
          description: Whatever the channel reported. Never read by the engine.
          additionalProperties: true

    ConsentState:
      type: object
      required: [marketing, profiling, thirdParty]
      properties:
        marketing:
          type: boolean
        profiling:
          type: boolean
        thirdParty:
          type: boolean

    Decision:
      type: object
      description: |
        A decision as it appears in search results, without the trace.

        Carries no latency. A decision's duration is a measurement of one
        execution and is read from its trace (`DecisionRecord.totalMs`). Until
        2026-09-11 this schema required `totalMs`, and the only thing that
        ever served it was a stopwatch reading of the fixture generator, frozen
        on whichever machine last built the index (G-052). An aggregate over
        decisions needs a measured source, and none exists (G-061).
      required:
        [id, artifactId, artifactVersion, tenantId, customerId, timestamp, channel,
         placement, winner, winnerOfferId, candidateCount]
      properties:
        id:
          type: string
        artifactId:
          type: string
        artifactVersion:
          type: string
        tenantId:
          type: string
        customerId:
          type: string
          description: Pseudonymised customer reference
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
        placement:
          type: string
        winner:
          type: [string, 'null']
          description: Action key of the winning candidate, or null if suppressed
        winnerOfferId:
          type: [string, 'null']
        candidateCount:
          type: integer

    DecisionRecord:
      type: object
      description: |
        A decision plus the full reasoning behind it. Everything here except
        `timings` is reproducible: `chainHash` covers only that reproducible
        half, which is what makes replay a byte-comparison rather than a
        judgement call.
      required:
        [id, artifactId, artifactVersion, tenantId, customerId, timestamp, channel,
         placement, winner, winnerOfferId, candidateCount, totalMs,
         eliminations, scores, arbitration, timings, constraintsApplied,
         consentState, chainHash, inputSnapshotHash]
      properties:
        id:
          type: string
        artifactId:
          type: string
        artifactVersion:
          type: string
        tenantId:
          type: string
        customerId:
          type: string
        timestamp:
          type: string
          format: date-time
        provenance:
          $ref: '#/components/schemas/Provenance' 
        channel:
          type: string
        placement:
          type: string
        winner:
          type: [string, 'null']
        winnerOfferId:
          type: [string, 'null']
        candidateCount:
          type: integer
        totalMs:
          type: number
        eliminations:
          type: array
          items:
            $ref: '#/components/schemas/Elimination'
        scores:
          type: object
          description: Score breakdown per candidate action key
          additionalProperties:
            $ref: '#/components/schemas/ScoreBreakdown'
        arbitration:
          type: object
          required: [formula, utility, missingScore, winner, runnerUp]
          properties:
            formula:
              type: string
            utility:
              type: object
              description: >
                Which ranking function produced these priorities. In the hashed
                decision because a decision has to identify every version that
                produced it — without this, two decisions ranked by different
                functions over the same catalogue are indistinguishable after
                the fact.
              required: [id, version]
              properties:
                id: { type: string }
                version: { type: string }
            missingScore:
              type: object
              description: >
                What ranking did about candidates nothing scored. A missing
                score must never become a silent zero: a neutral term is 1
                under exponentiation, not 0, and a flow may declare an approved
                default instead of relying on that. Present on every decision,
                including when nothing was missing, so "no default configured"
                stays distinguishable from "written by an older engine".
              required: [applied, approved]
              properties:
                applied:
                  type: array
                  description: >
                    Candidate keys that fell back, sorted. Empty when every
                    candidate was scored.
                  items: { type: string }
                approved:
                  type: [object, 'null']
                  description: >
                    The default the flow declared, or null when it declared
                    none and the engine used a neutral 1.0. The approver and
                    date are what make this a default rather than a constant.
                  required: [propensity, context, approvedBy, approvedAt]
                  properties:
                    propensity: { type: number }
                    context: { type: number }
                    approvedBy: { type: string }
                    approvedAt: { type: string, format: date-time }
            winner:
              type: [string, 'null']
            runnerUp:
              type: [string, 'null']
        timings:
          type: object
          description: Measured, not reproducible. Excluded from the chain hash.
          additionalProperties:
            type: number
        constraintsApplied:
          type: array
          items:
            type: string
        consentState:
          $ref: '#/components/schemas/ConsentState'
        creativeId:
          type: [string, 'null']
        sourceBindings:
          type: array
          description: Which connector supplied which input field. Reproducible.
          items:
            $ref: '#/components/schemas/SourceBinding'
        sourceCalls:
          type: array
          description: |
            What the integrations did on the wire. Measured, so absent on a
            replayed trace - replay calls no connectors.
          items:
            $ref: '#/components/schemas/SourceCall'
        chainHash:
          type: string
          description: sha256 over the reproducible half of the decision
        inputSnapshotHash:
          type: string

    ReplayResult:
      type: object
      description: The outcome of re-executing a historical decision.
      required:
        [identical, decisionId, replayedAt, artifactVersion, originalWinner,
         replayedWinner, originalChainHash, replayedChainHash, diff]
      properties:
        identical:
          type: boolean
          description: True when the two chain hashes match exactly
        decisionId:
          type: string
        replayedAt:
          type: string
          format: date-time
        artifactVersion:
          type: string
        originalWinner:
          type: [string, 'null']
        replayedWinner:
          type: [string, 'null']
        originalChainHash:
          type: string
        replayedChainHash:
          type: string
        diff:
          type: array
          description: Empty when identical is true
          items:
            type: object
            required: [path]
            properties:
              path:
                type: string
              original: {}
              replayed: {}

    Taxonomy:
      type: object
      description: The whole offer catalogue - Objective > Category > Offer.
      required: [objectives, categories, offers]
      properties:
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/Objective'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'

    OfferDetail:
      type: object
      description: An offer with everything needed to render its page.
      required: [offer, creatives, policies, autonomy]
      properties:
        offer:
          $ref: '#/components/schemas/Offer'
        creatives:
          type: array
          items:
            $ref: '#/components/schemas/Creative'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/TargetingPolicy'
        autonomy:
          oneOf:
            - $ref: '#/components/schemas/AutonomySetting'
            - type: 'null'
          description: Effective autonomy for this scope, or null if none resolves

    ChangeSetSimulation:
      type: object
      required: [ran, passed, populationSize, projectedMarginDelta, biasRatio, notes]
      properties:
        ran:
          type: boolean
        passed:
          type: boolean
        populationSize:
          type: integer
        projectedMarginDelta:
          type: string
        biasRatio:
          type: number
          description: Ratio between best and worst treated group. 1.0 is parity.
        notes:
          type: string

    ChangeSet:
      type: object
      description: A proposed change awaiting approval, from a person or an agent.
      required:
        [id, title, description, status, autonomyTier, requestedBy, requestedAt,
         decidedBy, decidedAt, decisionReason, targetScope, changeType, diff, simulation]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn]
        autonomyTier:
          type: integer
          enum: [1, 2, 3]
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        decidedBy:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
        decisionReason:
          type: [string, 'null']
        targetScope:
          $ref: '#/components/schemas/PolicyScope'
        changeType:
          type: string
        diff:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                type: string
              after:
                type: string
        simulation:
          oneOf:
            - $ref: '#/components/schemas/ChangeSetSimulation'
            - type: 'null'

    AuditEvent:
      type: object
      description: One entry in the append-only log. Every write produces one.
      required: [id, timestamp, actor, actorType, eventType, scope, summary, changeSetId]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        actorType:
          type: string
          enum: [human, agent, system]
        eventType:
          type: string
        scope:
          type: string
        summary:
          type: string
        changeSetId:
          type: [string, 'null']

    Diagnostic:
      type: object
      description: One compiler finding, with the remedy where there is one.
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        at:
          type: string
          description: Node id the finding attaches to
        message:
          type: string
        remedy:
          type: string

    CostManifest:
      type: object
      description: What the compiler predicts this flow will cost to run.
      required:
        [nodeCount, criticalPathMs, worstCaseMs, modelInvocations, latencyBudgetMs, withinBudget]
      properties:
        nodeCount:
          type: integer
        criticalPathMs:
          type: number
          description: Longest path through the DAG, not the sum of all nodes
        worstCaseMs:
          type: number
        modelInvocations:
          type: array
          items:
            type: object
            required: [nodeId, model]
            properties:
              nodeId:
                type: string
              model:
                type: string
        latencyBudgetMs:
          type: number
        withinBudget:
          type: boolean

    CompileResult:
      type: object
      required: [ok, diagnostics, artifact]
      properties:
        ok:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        artifact:
          oneOf:
            - $ref: '#/components/schemas/CompiledDecisionFlow'
            - type: 'null'
          description: |
            Null when compilation failed. The whole artifact, which is what the
            registry stores and the engine runs: this described four of its
            fields until 2026-09-11, so a reader could not see the nodes, and
            the tier each one implements was invisible to the console that
            needed it.

    FlowNode:
      type: object
      description: One node in a decision graph.
      required: [id, type, label, description, estimatedMs, position]
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        description:
          type: string
        estimatedMs:
          type: number
        policyIds:
          type: array
          items:
            type: string
        connectorIds:
          type: array
          description: Connectors a source node draws on. Their latency joins the critical path.
          items:
            type: string
        model:
          type: object
          required: [id, version]
          properties:
            id:
              type: string
            version:
              type: string
              description: Pinned. An unpinned model fails compilation.
        formula:
          type: string
        position:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number

    FlowEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string

    PublishedVersion:
      type: object
      description: One immutable version in the registry.
      required: [flowName, version, artifact, publishedAt, publishedBy, warnings]
      properties:
        flowName:
          type: string
        version:
          type: string
        artifact:
          $ref: '#/components/schemas/CompiledDecisionFlow'
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        warnings:
          type: array
          description: |
            Kept with the version rather than discarded on success. A flow
            that published near its latency budget is a different thing to
            explain in six months than one that published clean.
          items:
            $ref: '#/components/schemas/Diagnostic'

    EnvironmentState:
      type: object
      description: What an environment is running, and what rollback returns to.
      required: [environment, activeVersion, previousVersion, shadowVersion, promotedAt, promotedBy]
      properties:
        environment:
          type: string
        activeVersion:
          type: [string, 'null']
        previousVersion:
          type: [string, 'null']
          description: Null when there is nothing to roll back to.
        shadowVersion:
          type: [string, 'null']
          description: >
            A version running beside the active one and deciding nothing. Its
            output never reaches a customer — the active version's answer is
            always the one returned. What the shadow produces is compared and
            recorded, which is how a migration is evidenced rather than
            asserted. Null when nothing is shadowing, which is the normal state.
        promotedAt:
          type: [string, 'null']
        promotedBy:
          type: [string, 'null']

    PublishOutcome:
      type: object
      description: |
        The result of a publish. `published` stored a new version, `unchanged`
        found byte-identical content already there, and `rejected` stored
        nothing - either the flow did not compile, or the version already
        holds different content.
      required: [status, diagnostics]
      properties:
        status:
          type: string
          enum: [published, unchanged, rejected]
        reason:
          type: string
          enum: [compilation, immutable]
          description: Present when status is `rejected`.
        artifact:
          oneOf:
            - $ref: '#/components/schemas/CompiledDecisionFlow'
            - type: 'null'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        existingHash:
          type: string
          description: Present when refused as immutable.
        attemptedHash:
          type: string
          description: Present when refused as immutable.

    ShadowReport:
      type: object
      required:
        - flowName
        - activeVersion
        - shadowVersion
        - compared
        - agreed
        - agreementRate
        - topDivergences
        - shadowMsP50
        - shadowMsP95
      properties:
        flowName: { type: string }
        activeVersion: { type: [string, 'null'] }
        shadowVersion: { type: [string, 'null'] }
        compared: { type: integer }
        agreed: { type: integer }
        agreementRate:
          type: number
          description: 0 when nothing has been compared, never 1.
        topDivergences:
          type: array
          items:
            type: object
            required: [kind, summary, count]
            properties:
              kind:
                type: string
                enum: [winner, ranking, reasons]
              summary: { type: string }
              count: { type: integer }
        shadowMsP50: { type: number }
        shadowMsP95:
          type: number
          description: >
            The tail is the number that matters: a shadow whose p95 is 100ms is
            not free, whatever its median says.

    RegistryEvent:
      type: object
      description: One entry in the registry's append-only log.
      required: [seq, at, actor, type, tenantId, flowName, version, summary]
      properties:
        seq:
          type: integer
          description: Monotonic. The order is a fact, not a sort key.
        at:
          type: string
          format: date-time
        actor:
          type: string
        type:
          type: string
          enum: [ArtifactPublished, PublishRejected, VersionPromoted, VersionRolledBack]
        tenantId:
          type: string
        flowName:
          type: string
        version:
          type: string
        environment:
          type: string
        summary:
          type: string
        diagnostics:
          type: array
          description: Present on PublishRejected.
          items:
            $ref: '#/components/schemas/Diagnostic'

    FieldBinding:
      type: object
      description: One field a connector supplies, and where it lives in the response.
      required: [field, path, type]
      properties:
        field:
          type: string
          description: The name the field takes in the decision input
        path:
          type: string
          description: Dotted path into the connector's response payload
        type:
          type: string
          enum: [string, number, boolean]
        defaultValue:
          description: Used when the connector fails and its failure mode is `default`
          oneOf:
            - type: string
            - type: number
            - type: boolean

    RecordedBody:
      type: object
      description: |
        One side of a call. JSON bodies are parsed so a client can render them
        structurally; anything else is kept as text, because a proxy's HTML
        error page is exactly what somebody debugging needs to see. A body over
        the cap is truncated and says so rather than being dropped.
      required: [bytes, truncated]
      properties:
        json:
          description: The parsed body, when it was JSON and within the cap.
        text:
          type: string
          nullable: true
          description: The raw body, when it was not JSON or was truncated.
        bytes:
          type: integer
          description: Size of the original body in bytes, before any truncation.
        truncated:
          type: boolean

    InboundCall:
      type: object
      description: A single request/response pair served by the API.
      required: [id, at, method, path, status, durationMs, origin]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
          description: When the request arrived, not when it completed.
        method:
          type: string
          enum: [GET, POST, PUT]
        path:
          type: string
        query:
          type: string
          nullable: true
        status:
          type: integer
        durationMs:
          type: integer
        request:
          $ref: '#/components/schemas/RecordedBody'
        response:
          $ref: '#/components/schemas/RecordedBody'
        origin:
          type: string
          enum: [storefront, console, unknown]
          description: |
            Derived from `Referer`. A label for reading the log, never
            authentication — it is trivially spoofed and nothing is gated on it.
        decisionId:
          type: string
          nullable: true
          description: Lifted from the response when the call produced a decision, so the row can link to its trace.
        error:
          type: string
          nullable: true

    Connector:
      type: object
      description: |
        A configured route to data the platform does not hold. Used at decision
        time: a flow's source node names the connectors it needs, resolution
        fetches them before execution, and the values land in the input the
        engine hashes. Replay never calls a connector - it replays against the
        recorded snapshot.
      required:
        [id, name, kind, description, target, declaredP95Ms, timeoutMs, onFailure,
         cacheTtlSeconds, provides, active, updatedAt, updatedBy]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [rest, feature-store, static]
        description:
          type: string
        target:
          type: string
          description: Endpoint, feature-store namespace, or empty for `static`
        declaredP95Ms:
          type: number
          description: |
            Declared, not measured. The compiler adds it to the critical path, so
            a connector that cannot fit the latency budget fails compilation
            rather than failing in production.
        timeoutMs:
          type: number
        onFailure:
          type: string
          enum: [fail, omit, default]
        cacheTtlSeconds:
          type: integer
          description: 0 disables caching. Caching is measured, never hashed.
        provides:
          type: array
          items:
            $ref: '#/components/schemas/FieldBinding'
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    Placement:
      type: object
      description: |
        A content slot in a customer journey, configured rather than assumed.

        `placement` has been a string on a decision request since the beginning
        — the engine reads it for the context term and records it. This is that
        string given a configuration: how many actions the slot holds, and which
        flow answers for it.

        Not part of the catalogue the engine hashes. A placement governs how a
        decision is delivered, not what is decided, so changing a slot count
        moves no chain hash. The consequence is that a slate is reproducible
        from its decision *plus* the placement that composed it.
      required:
        [id, key, name, description, channel, slotCount, artifactId, decidable,
         delivery, updatedAt, updatedBy]
      properties:
        id:
          type: string
        key:
          type: string
          description: The value a decision request carries, and a creative names.
        name:
          type: string
        description:
          type: string
        channel:
          type: string
          enum: [email, sms, web, push, outbound_call]
        type:
          type: string
          enum: [carousel, feature_band, footer_bar, hero, page_takeover, tile]
          description: |
            The shape this slot renders in. Web only — a hero and a tile are
            different designs, and a creative declares which it was made for.
            An email placement carries none rather than a value that means
            nothing.
        slotCount:
          type: integer
          minimum: 1
          description: |
            At most this many actions. A hero is 1, a grid is 3. The decision is
            the same either way; this governs how much of the ranking the caller
            is given.
        artifactId:
          type: string
        decidable:
          type: boolean
          description: |
            May a decision be made for this slot. `decidePlacement` answers 404
            when it is false.

            This was `active`, a boolean with no description, and it was
            answering two questions at once — whether a decision may be made,
            and whether anything delivers the result. The two came apart exactly
            where this platform is: it decides on five channels and delivers on
            one. `weekly_offers_send` was `active: false` on the grounds that
            nothing sent it, while the corpus decided for it 2,042 times.
            ADR-013 §2, G-043.
        delivery:
          type: [object, 'null']
          description: |
            Who gets the result of a decision to the customer, and `null` when
            nothing does.

            `null` is not a defect to be corrected away. It is the honest state
            of a slot that is worth deciding for and has no far end, which is
            four of the demo tenant's five channels.
          required: [mode]
          properties:
            mode:
              type: string
              enum: [caller, adapter]
              description: |
                `caller` — the platform returns a slate and whoever asked
                renders it. That is what web has always been: `decidePlacement`
                answers and the website delivers. An outbound call is the same
                shape with a person as the renderer.

                `adapter` — the platform sends it. Nothing does yet; W-017 is
                blocked on W-008, because no recipient address exists anywhere
                in the profile schema.
            adapterId:
              type: string
              description: Which adapter. Absent while `mode` is `caller`.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    DeliveryAttempt:
      type: object
      description: |
        What the platform did about getting one decision to a customer.

        **Not an outcome.** An outcome is something the customer did; this is
        something the platform did. `OutcomeType` is a nested, monotone funnel —
        conversion ⊆ acceptance ⊆ click ⊆ impression — that `buildPerformance`
        computes rates over, and folding the platform's own actions into it
        would make every rate a ratio over a denominator that mixes the two.
        ADR-013 §1.

        Bound to a decision id and nothing else, per ADR-008 §2, and refused
        when that decision cannot be found — the same invariant `recordOutcome`
        enforces.
      required: [tenantId, decisionId, placementKey, channel, state, at]
      properties:
        tenantId:
          type: string
        decisionId:
          type: string
          description: The decision this was an attempt to deliver. The whole binding.
        placementKey:
          type: string
        channel:
          type: string
          enum: [email, sms, web, push, outbound_call]
        state:
          type: string
          enum: [accepted, deferred, dispatched, delivered, failed, suppressed]
          description: |
            `accepted` the platform took responsibility for sending it ·
            `deferred` held for quiet hours, throttle or backoff ·
            `dispatched` handed to whoever delivers it ·
            `delivered` arrival confirmed ·
            `failed` it will not arrive ·
            `suppressed` not attempted, and `reason` says why.

            Phase one writes `dispatched` and `suppressed` only. The other four
            need an adapter, and the states are declared now so the record does
            not have to change shape when one arrives.
        at:
          type: string
          format: date-time
        reason:
          type: [string, 'null']
          description: |
            Why, for a state that needs one. `no_adapter` where the placement
            has no delivery mode; `adapter_not_built` where it names one that
            does not exist yet.
        permanent:
          type: [boolean, 'null']
          description: |
            Whether a failure is worth retrying. Null where the state is not a
            failure. A permanent failure is information about the address rather
            than about the offer, and belongs to contactability (W-013) rather
            than to the offer's performance.
        providerRef:
          type: [string, 'null']
          description: |
            The deliverer's own id for this send.

            Stored because bounce and complaint webhooks arrive keyed by the
            provider's id and not by ours, so without it the return path would
            have to be reconstructed from customer and time — which ADR-008 §2
            forbids. Null while nothing sends.

    SlateEntry:
      type: object
      description: One filled slot.
      required: [rank, action, priority]
      properties:
        rank:
          type: integer
          minimum: 1
        action:
          type: string
          description: The action key, as the decision named it.
        priority:
          type: number
          description: The priority ranking gave it — the same number that chose the winner.
        offerId:
          type: [string, 'null']
          description: The offer this action belongs to, resolved from the catalogue.

    CreativeRejected:
      type: object
      description: |
        Why a creative was refused, one entry per problem. Every problem at
        once: a caller fixing one field per round trip is a caller making five.
      required: [error, message, problems]
      properties:
        error:
          type: string
          enum: [invalid_creative]
        message:
          type: string
        problems:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Dotted path into the creative, e.g. `content.text`.
              message:
                type: string

    SourceBinding:
      type: object
      description: Which connector supplied a field. Reproducible; part of the hashed decision.
      required: [field, connectorId, nodeId]
      properties:
        field:
          type: string
        connectorId:
          type: string
        nodeId:
          type: string

    SourceCall:
      type: object
      description: What an integration actually did. Measured; never hashed, absent on replay.
      required: [connectorId, ms, cacheHit, outcome, fields, fetchedAt]
      properties:
        connectorId:
          type: string
        ms:
          type: number
        cacheHit:
          type: boolean
        outcome:
          type: string
          enum: [ok, timeout, error, skipped]
        fields:
          type: array
          items:
            type: string
        detail:
          type: string
        fetchedAt:
          type: string
          format: date-time
          description: |
            When this decision asked for the value. ms says how long the answer
            took; a duration on its own cannot place a call in time.
        observedAt:
          type: string
          format: date-time
          description: |
            When the value itself was computed at the source. The same as
            fetchedAt for a call that reached the connector; for a cache hit it
            is when the cached value was fetched, which may be much older.

            Absent when a cache cannot say. A cache that does not record when it
            stored a value leaves a decision unable to say whether the flag it
            used was current, and that is recorded as unknown rather than
            filled in with the time of the cache read.

    ArtifactSummary:
      type: object
      description: |
        A flow as the console lists and renders it. Distinct from
        CompiledArtifact, which is the registry's immutable executable form.
      required:
        [id, name, description, activeVersion, versions, nodeCount,
         estimatedP95LatencyMs, status, candidateKeys, nodes, edges, updatedAt, updatedBy]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        activeVersion:
          type: string
        versions:
          type: array
          items:
            type: string
        nodeCount:
          type: integer
        estimatedP95LatencyMs:
          type: number
        status:
          type: string
        candidateKeys:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FlowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/FlowEdge'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        compileOk:
          type: [boolean, 'null']
          description: Compile summary. Present on the list endpoint.
        errorCount:
          type: integer
        warningCount:
          type: integer
        compilation:
          oneOf:
            - $ref: '#/components/schemas/CompileResult'
            - type: 'null'
          description: Full compiler output. Present on the detail endpoint.

  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    FlowName:
      name: flowName
      in: path
      required: true
      schema:
        type: string
    ChangeSetId:
      name: changeSetId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum rows to return. The response total is unpaged.
      schema:
        type: integer
        minimum: 1
        default: 50

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      summary: Exchange credentials for a session token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Wrong email or password

  /auth/session:
    get:
      summary: Resolve the current session
      operationId: getSession
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: No valid session. The only status that clears the token.

  # ---------------------------------------------------------------------------
  # Offer catalogue
  # ---------------------------------------------------------------------------
  /taxonomy/{tenantId}:
    get:
      summary: The whole offer taxonomy in one call
      operationId: getTaxonomy
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Objectives, categories and offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'

  /objectives/{tenantId}:
    post:
      summary: Create an objective
      operationId: createObjective
      description: |
        The top level of the taxonomy: what the business is trying to achieve.

        Until this existed the taxonomy was fixture-authored, so the first step
        of the marketer's journey — before the offer, before the creative — was
        the only one that needed a redeploy. Reading it has been possible since
        the spec was written; writing it has not.

        There is no list operation here on purpose. `getTaxonomy` already
        returns objectives, categories and offers in one call, and the engine
        consumes the taxonomy as a snapshot, so a second way to read half of it
        would be a second thing to keep in step.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Objective'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        '400':
          description: A required field is missing
        '403':
          description: Caller lacks edit:offers
        '409':
          description: The key is already used by another objective

  /objectives/{tenantId}/{objectiveId}:
    put:
      summary: Update an objective
      operationId: updateObjective
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: objectiveId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Objective'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        '403':
          description: Caller lacks edit:offers
        '404':
          description: No such objective

  /categories/{tenantId}:
    post:
      summary: Create a category
      operationId: createCategory
      description: |
        The second level: a product or service grouping under one objective.

        A category names the objective it sits under, and one that names an
        objective the tenant does not have is refused rather than orphaned —
        `Catalogue.putCategory` in `packages/catalogue` states the rule and this
        endpoint answers to the same one. A category outside the taxonomy cannot
        be reached by a decision flow, so accepting it would create an entity
        that looks authored and can never be chosen.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: A required field is missing, or the objective does not exist
        '403':
          description: Caller lacks edit:offers
        '409':
          description: The key is already used by another category

  /categories/{tenantId}/{categoryId}:
    put:
      summary: Update a category
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: The objective does not exist
        '403':
          description: Caller lacks edit:offers
        '404':
          description: No such category

  /offers/{tenantId}:
    get:
      summary: List offers, filtered
      operationId: listOffers
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: objectiveId
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, retired]
        - name: q
          in: query
          description: Free-text match on name, key or tag
          schema:
            type: string
      responses:
        '200':
          description: Matching offers
          content:
            application/json:
              schema:
                type: object
                required: [offers, total]
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
                  total:
                    type: integer

    post:
      summary: Create an offer
      operationId: createOffer
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '403':
          description: Caller lacks edit:offers

  /offers/{tenantId}/{offerId}:
    get:
      summary: An offer with its creatives, policies and effective autonomy
      operationId: getOffer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Offer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetail'
        '404':
          description: No such offer

    put:
      summary: Update an offer
      operationId: updateOffer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '403':
          description: Caller lacks edit:offers

  /creatives/{tenantId}:
    get:
      summary: Every creative in the catalogue
      operationId: listAllCreatives
      x-metis-status: built
      description: |
        The content library, across offers.

        Creatives were reachable only through the offer that owns them, so
        "what content do we have", "what is switched off" and "which offers have
        nothing on email" had no answer. Each creative still belongs to exactly
        one offer — `offerId` is a foreign key, not a link — and this reads
        across them rather than changing that.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: channel
          in: query
          schema:
            type: string
            enum: [email, sms, web, push, outbound_call]
        - name: active
          in: query
          description: Filter on delivery state. Omit for both.
          schema:
            type: boolean
        - name: q
          in: query
          description: Matches the name, the owning offer's key, and the content.
          schema:
            type: string
      responses:
        '200':
          description: Creatives
          content:
            application/json:
              schema:
                type: object
                required: [creatives, total]
                properties:
                  creatives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Creative'
                  total:
                    type: integer

  /creatives/{tenantId}/{offerId}:
    get:
      summary: Creatives for an offer, one per channel
      operationId: listCreatives
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Creatives
          content:
            application/json:
              schema:
                type: object
                required: [creatives]
                properties:
                  creatives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Creative'

    post:
      summary: Add a creative to an offer
      operationId: createCreative
      x-metis-status: built
      description: |
        Content for one channel. An offer needs at least one active creative
        before it can be delivered, which is why this exists: until it did, the
        only way to give an offer content was to edit a fixture and redeploy.

        The content is checked against the channel it declares — required
        fields, the 160-character SMS segment limit, a sender id carriers will
        accept, an address that is an address, a call to action that goes
        somewhere. Every problem is reported at once rather than the first, so a
        caller is not making one round trip per field.

        **Not built here:** uploading an asset. `imageUrl` is a reference the
        caller supplies, and nothing in the platform stores or serves the file
        it names. Content approval, effective dating and expiry are W-015.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Creative'
      responses:
        '201':
          description: Created, and attached to the offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creative'
        '400':
          description: |
            The content does not satisfy its channel. The body lists every
            problem, each naming the field it is about.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRejected'
        '403':
          description: Caller lacks edit:offers
        '404':
          description: No such offer
        '409':
          description: A creative already uses that id

  /creatives/{tenantId}/{offerId}/{creativeId}:
    put:
      summary: Edit a creative, or switch it on and off
      operationId: updateCreative
      x-metis-status: built
      description: |
        The same content rules as creation.

        Deactivating is refused when it would leave an active offer with no
        deliverable content — the offer would keep winning decisions and have
        nothing to render, which is the state this and `createOffer` exist to
        make unreachable. Pause or retire the offer first.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Creative'
      responses:
        '200':
          description: Updated, and written to the audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creative'
        '400':
          description: The content does not satisfy its channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRejected'
        '403':
          description: Caller lacks edit:offers
        '404':
          description: No such offer or creative
        '409':
          description: |
            Switching this off would leave an active offer with no active
            creative.

