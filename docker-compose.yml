# Compose holds what is connected. ADR-016 §6.
#
# `postgres` backs the catalogue, the artifact registry, the decision ledger
# and governance when METIS_DATABASE_URL points at it; without that variable
# every store runs in memory and says so.
#
# EventStoreDB, Redis and ClickHouse were declared here, unused, until
# 2026-09-14. They are removed rather than kept as intent: a deployment is
# written by reading this file, and each unused service it copies is a
# stateful thing to patch, back up and reach with erasure. Append-only audit is
# Postgres triggers; Redis and ClickHouse each enter only when a measurement
# says so (ADR-016 §6.3, §6.4; ADR-014 §3; ADR-008 §3).
version: '3.8'

services:
  # Backs packages/registry. Schema: packages/registry/migrations/001_registry.sql
  postgres:
    image: postgres:15.8-alpine
    environment:
      POSTGRES_DB: metis
      POSTGRES_USER: metis
      POSTGRES_PASSWORD: metis-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:

networks:
  default:
    name: metis-dev
